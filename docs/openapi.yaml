openapi: 3.0.3

# ============================================================================
# API KELASI — Contrat d'API officiel (V1)
# ----------------------------------------------------------------------------
# Source de vérité unique pour le backend, le frontend public et le back-office.
# Toute modification de ce fichier passe par une PR revue par le lead dev,
# puis est annoncée à toute la Squad. Aucune modification silencieuse.
#
# Nomenclature : les noms de champs reprennent EXACTEMENT les colonnes de la
# base (docs/schema.sql). SQL -> JSON se fait par simple renommage de casse :
# programs.short_name -> programs.short_name, aucun alias requis côté backend.
# ============================================================================

info:
  title: API Kelasi
  version: 1.0.0
  description: |
    API de la plateforme **Kelasi** — orientation des nouveaux bacheliers vers
    les instituts privés de Brazzaville (MVP V1, périmètre Brazzaville).

    **Rappels de cadrage :**
    - L'accès public est totalement libre : aucun compte utilisateur côté étudiant.
    - L'administration (routes `/admin` + `/auth`) est réservée à la Squad (authentification Bearer).
    - Le numéro d'agrément est recopié du document officiel ; `null` = en cours de vérification,
      et l'interface DOIT afficher le badge « Agrément en cours de vérification » dans ce cas.
    - Les montants sont exprimés en FCFA (entiers).
    - **Les identifiants sont des entiers** (colonnes `SERIAL` en base), pas des slugs.
      `GET /formations/12` renvoie la formation d'id 12.
    - `district` est stocké et renvoyé **sans accents** (`Makelekele`, `Talangai`, `Ouenze`),
      quelle que soit la langue d'affichage. Les libellés traduits restent côté frontend.

    **Convention d'erreur :** toute erreur renvoie le schéma `Error`
    avec un code machine (`code`) et un message lisible (`message`).

servers:
  - url: http://localhost:4000/api
    description: Développement local
  - url: https://kelasi.cg/api
    description: Production (prévu)

tags:
  - name: Public
    description: Consultation libre — site étudiant (frontend)
  - name: Contact
    description: Formulaires publics (contact institut, référencement)
  - name: Auth
    description: Authentification Squad (back-office)
  - name: Admin
    description: CRUD back-office — authentification Bearer requise

security: []

paths:
  # --------------------------------------------------------------------------
  # PUBLIC
  # --------------------------------------------------------------------------
  /formations:
    get:
      tags: [Public]
      summary: Rechercher des formations
      description: |
        Recherche multi-critères. Le paramètre `q` cherche dans le nom de la
        formation, les métiers visés, les cours, le nom et le sigle de l'institut
        (insensible à la casse et aux accents).
      parameters:
        - name: q
          in: query
          description: Recherche plein-texte (nom, métier, cours, institut)
          schema: { type: string }
          example: infirmier
        - name: domaine_id
          in: query
          description: Identifiant du domaine
          schema:
            type: string
            enum: [gestion, info, sante, btp, petrole, com, logi, droit, agro, hotel]
          example: sante
        - name: district
          in: query
          description: Un des 9 arrondissements de Brazzaville (sans accents)
          schema:
            type: string
            enum: [Makelekele, Bacongo, Poto-Poto, Moungali, Ouenze, Talangai, Mfilou, Madibou, Djoue]
          example: Makelekele
        - name: degree
          in: query
          description: Type de diplôme visé
          schema:
            type: string
            enum: [BTS, Licence, Licence pro, Master]
        - name: career
          in: query
          description: Métier visé (débouché), correspondance exacte
          schema: { type: string }
          example: Infirmier
        - name: duration
          in: query
          description: Durée en années
          schema: { type: integer, enum: [2, 3] }
        - name: max_tuition
          in: query
          description: Budget maximum par an (FCFA)
          schema: { type: integer, minimum: 0 }
          example: 500000
        - name: bac_series
          in: query
          description: Séries du bac acceptées par la formation
          schema:
            type: string
            enum: [A, B, C, D, E, F, G]
        - name: evening
          in: query
          description: Uniquement les formations avec cours du soir
          schema: { type: boolean, default: false }
        - name: internship
          in: query
          description: Uniquement les formations avec stage inclus
          schema: { type: boolean, default: false }
        - name: installments
          in: query
          description: Uniquement les formations payables en tranches
          schema: { type: boolean, default: false }
        - name: sort
          in: query
          description: Ordre de tri des résultats
          schema:
            type: string
            enum: [relevance, tuition_asc, tuition_desc, duration]
            default: relevance
      responses:
        "200":
          description: Liste des formations correspondant aux critères
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramList" }
        "400":
          description: Paramètre invalide
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: PARAMETRE_INVALIDE
                message: "« max_tuition » doit être un nombre entier positif."

  /formations/{id}:
    get:
      tags: [Public]
      summary: Consulter une formation
      parameters:
        - $ref: "#/components/parameters/IdFormation"
      responses:
        "200":
          description: Fiche détaillée de la formation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramDetail" }
        "404":
          description: Formation introuvable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: FORMATION_INTROUVABLE
                message: "Aucune formation ne correspond à cet identifiant."

  /instituts:
    get:
      tags: [Public]
      summary: Lister les instituts
      parameters:
        - name: district
          in: query
          description: Filtre par arrondissement (sans accents)
          schema:
            type: string
            enum: [Makelekele, Bacongo, Poto-Poto, Moungali, Ouenze, Talangai, Mfilou, Madibou, Djoue]
        - name: accredited
          in: query
          description: Uniquement les instituts agréments
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Liste des instituts
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: { type: integer, example: 8 }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InstituteSummary" }

  /instituts/{id}:
    get:
      tags: [Public]
      summary: Consulter la fiche d'un institut
      description: |
        Fiche complète de l'établissement, incluant la liste résumée de ses
        formations (US-04 / EX-04).
      parameters:
        - $ref: "#/components/parameters/IdInstitut"
      responses:
        "200":
          description: Fiche détaillée de l'institut
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstituteDetail" }
        "404":
          description: Institut introuvable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: INSTITUT_INTROUVABLE
                message: "Aucun institut ne correspond à cet identifiant."

  /domaines:
    get:
      tags: [Public]
      summary: Lister les domaines de formation
      responses:
        "200":
          description: Les 10 domaines
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Domain" }

  /arrondissements:
    get:
      tags: [Public]
      summary: Lister les 9 arrondissements de Brazzaville
      responses:
        "200":
          description: Arrondissements avec nombre de formations disponibles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/District" }

  /metiers:
    get:
      tags: [Public]
      summary: Lister les métiers (débouchés)
      description: Liste distincte et triée des métiers — pour le filtre « métier visé ».
      responses:
        "200":
          description: Métiers avec nombre de formations associées
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Career" }

  # --------------------------------------------------------------------------
  # CONTACT (formulaires publics)
  # --------------------------------------------------------------------------
  /contact:
    post:
      tags: [Contact]
      summary: Envoyer une question à un institut
      description: |
        Transmet la question d'un bachelier au secrétariat de l'institut
        (e-mail) sans créer de compte (EX-06).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactRequestInput" }
            example:
              program_id: 12
              name: Grâce Mabiala
              email: grace.mabiala@email.com
              message: Reste-t-il des places pour la rentrée ?
      responses:
        "202":
          description: Demande acceptée et mise en file d'envoi
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { type: boolean, example: true }
        "400":
          description: Champs invalides
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Formation ou institut introuvable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /referencement:
    post:
      tags: [Contact]
      summary: Demande de référencement d'un institut
      description: |
        Formulaire public « Référencer mon institut ». La Squad reprend ensuite
        contact pour un rendez-vous et la vérification de l'agrément — l'institut
        ne crée jamais sa fiche lui-même (exclusion V1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferralRequestInput" }
            example:
              institute_name: Institut Supérieur de Technologie de Madibou
              district: Madibou
              phone: "+242 06 000 00 00"
              contact_person: Alain Boulou
              accreditation_number: null
      responses:
        "202":
          description: Demande acceptée
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { type: boolean, example: true }
        "400":
          description: Champs invalides
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # --------------------------------------------------------------------------
  # AUTH (back-office)
  # --------------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      summary: Connexion Squad
      description: Authentifie un membre de la Squad et renvoie un token JWT pour les routes `/admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
            example:
              username: squad
              password: kelasi2026
      responses:
        "200":
          description: Token d'authentification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401":
          description: Identifiants incorrects
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: IDENTIFIANTS_INVALIDES
                message: "Identifiant ou mot de passe incorrect."

  /auth/logout:
    post:
      tags: [Auth]
      summary: Déconnexion
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session terminée

  # --------------------------------------------------------------------------
  # ADMIN (back-office — Bearer requis)
  # --------------------------------------------------------------------------
  /admin/indicators:
    get:
      tags: [Admin]
      summary: KPI du dashboard
      description: |
        Les 5 indicateurs officiels du dashboard Squad — cette liste est LA
        référence unique (elle doit être identique partout : FRD, back-office).
        Correspond à la vue SQL `indicators`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Indicateurs de pilotage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Indicators" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/formations:
    post:
      tags: [Admin]
      summary: Créer une formation
      description: |
        Le backend crée aussi les `career` et `course` manquants à partir des
        noms fournis (upsert sur `careers.name`, qui est UNIQUE), puis les
        rattachent via `program_careers` et `courses`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramInput" }
      responses:
        "201":
          description: Formation créée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramDetail" }
        "400":
          description: Champs invalides
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/formations/{id}:
    put:
      tags: [Admin]
      summary: Modifier une formation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdFormation"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramInput" }
      responses:
        "200":
          description: Formation mise à jour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramDetail" }
        "404":
          description: Formation introuvable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Admin]
      summary: Supprimer une formation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdFormation"
      responses:
        "204":
          description: Formation supprimée
        "404":
          description: Formation introuvable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/instituts:
    post:
      tags: [Admin]
      summary: Créer un institut
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstituteInput" }
      responses:
        "201":
          description: Institut créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstituteDetail" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/instituts/{id}:
    put:
      tags: [Admin]
      summary: Modifier un institut
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdInstitut"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstituteInput" }
      responses:
        "200":
          description: Institut mis à jour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstituteDetail" }
        "404":
          description: Institut introuvable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Admin]
      summary: Supprimer un institut
      description: |
        Refusé (409) tant que l'institut possède des formations. En base, les
        formations sont supprimées en cascade si l'institut disparaît — le
        backend doit donc vérifier `programs` avant de valider.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdInstitut"
      responses:
        "204":
          description: Institut supprimé
        "409":
          description: Institut avec formations rattachées
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: INSTITUT_NON_VIDE
                message: "Supprimez ou déplacez d'abord les formations de cet institut."
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/images:
    post:
      tags: [Admin]
      summary: Téléverser une image d'institut
      description: Upload multipart (image de la fiche — EX-04). Formats acceptés JPEG/PNG/WebP, 5 Mo maximum.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Image enregistrée
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, example: "/uploads/institutes/4-isda-2026.jpg" }
        "400":
          description: Fichier invalide
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"

# =============================================================================
# COMPOSANTS
# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdFormation:
      name: id
      in: path
      required: true
      description: Identifiant numérique de la formation (colonne `programs.id`, SERIAL)
      schema: { type: integer, minimum: 1 }
      example: 12
    IdInstitut:
      name: id
      in: path
      required: true
      description: Identifiant numérique de l'institut (colonne `institutes.id`, SERIAL)
      schema: { type: integer, minimum: 1 }
      example: 4

  responses:
    Unauthorized:
      description: Token manquant ou invalide
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: NON_AUTORISE
            message: "Authentification Squad requise."

  schemas:
    # ------------------------------------------------------------------ Commun
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Code machine stable (ne jamais l'afficher tel quel à l'utilisateur)
          example: FORMATION_INTROUVABLE
        message:
          type: string
          description: Message lisible, en français
          example: "Aucune formation ne correspond à cet identifiant."

    Domain:
      type: object
      description: Table `domains`
      required: [id, name, color]
      properties:
        id: { type: string, example: sante }
        name: { type: string, example: "Santé" }
        color: { type: string, example: "#B03352", description: Couleur de la couverture (hex) }

    District:
      type: object
      description: Vue agrégée — aucun district n'est stocké en table, les 9 valeurs viennent de `institutes.district`
      required: [name, program_count]
      properties:
        name: { type: string, example: Makelekele, description: Slug sans accents }
        program_count: { type: integer, example: 5 }

    Career:
      type: object
      description: Table `careers` + count agrégé depuis `program_careers`
      required: [id, name, program_count]
      properties:
        id: { type: integer, example: 43 }
        name: { type: string, example: Infirmier }
        program_count: { type: integer, example: 1 }

    # --------------------------------------------------------------- Instituts
    InstituteSummary:
      type: object
      description: Colonnes `institutes` (sous-ensemble affiché en liste)
      required: [id, short_name, name, district, accreditation_status]
      properties:
        id: { type: integer, example: 4 }
        short_name: { type: string, example: ISD }
        name: { type: string, example: "Institut de Santé du Djoué" }
        district: { type: string, example: Makelekele, description: Slug sans accents }
        accreditation_status:
          type: string
          enum: [agre, en_cours]
          description: "`agre` → badge bleu ; `en_cours` → badge gris « en cours de vérification »"
        accreditation_number:
          type: string
          nullable: true
          example: "N° 156/MESRTI/2012"
          description: Recopié du document officiel ; null si en_cours

    InstituteDetail:
      description: Colonnes `institutes` + `programs` rattachés
      allOf:
        - $ref: "#/components/schemas/InstituteSummary"
        - type: object
          required: [address, phone, whatsapp, email, color, description, registration_fee, registration_deadline, start_date, programs]
          properties:
            address: { type: string, example: "Route du Djoué, Makélékélé", nullable: true }
            phone: { type: string, example: "+242 06 409 88 52", nullable: true }
            whatsapp: { type: string, example: "242064098852", nullable: true, description: Numéro international sans « + » (pour wa.me) }
            email: { type: string, format: email, example: "contact@isd.cg", nullable: true }
            color: { type: string, example: "#B03352", nullable: true }
            image_url:
              type: string
              nullable: true
              example: "/uploads/institutes/4-isda-2026.jpg"
              description: Image de l'institut (EX-04) ; null → couverture de couleur
            description: { type: string, example: "Métiers paramédicaux, avec stages encadrés dans des centres de santé de Brazzaville.", nullable: true }
            registration_fee: { type: integer, example: 75000, description: FCFA }
            registration_deadline: { type: string, example: "27 sept.", nullable: true }
            start_date: { type: string, example: "20 oct. 2026", nullable: true }
            programs:
              type: array
              description: Formations résumées de cet institut (jointure sur `programs.institute_id`)
              items: { $ref: "#/components/schemas/ProgramSummary" }

    # ---------------------------------------------------------------- Programs
    ProgramSummary:
      type: object
      description: Colonnes `programs` enrichies des relations `careers` / `institutes` / `domains`
      required: [id, name, degree, duration, tuition, careers, domain, institute]
      properties:
        id: { type: integer, example: 12 }
        name: { type: string, example: "Sciences infirmières" }
        degree:
          type: string
          enum: [BTS, Licence, Licence pro, Master]
        duration: { type: integer, example: 3, description: Années }
        tuition: { type: integer, example: 650000, description: "Scolarité par an, en FCFA" }
        bac_series:
          type: string
          nullable: true
          example: "CD"
          description: Séries acceptées ; null si accessible post-Licence (Master)
        evening: { type: boolean, example: false }
        internship_months: { type: integer, example: 6, description: Durée du stage en mois ; 0 = aucun }
        installments: { type: boolean, example: true, description: Paiement en plusieurs fois possible }
        careers:
          type: array
          description: Métiers visés (table `careers` via `program_careers`)
          items: { type: string }
          example: ["Infirmier", "Agent de santé communautaire"]
        domain: { $ref: "#/components/schemas/Domain" }
        institute: { $ref: "#/components/schemas/InstituteSummary" }

    ProgramYear:
      type: object
      description: Colonnes `program_years` + cours agrégés via `year_courses`
      required: [id, level, order, courses]
      properties:
        id: { type: integer, example: 31 }
        level: { type: string, example: L1, description: "L1/L2/L3, 1e année/2e année ou M1/M2" }
        order: { type: integer, example: 1 }
        courses:
          type: array
          items: { type: string }
          example: ["Anatomie et physiologie", "Soins infirmiers de base"]

    ProgramDetail:
      description: Colonnes `programs` + `courses` / `program_years` / `year_courses`
      allOf:
        - $ref: "#/components/schemas/ProgramSummary"
        - type: object
          required: [courses, years]
          properties:
            courses:
              type: array
              description: Liste plate des cours (les années sont regroupées dans `years`)
              items: { type: string }
            years:
              type: array
              description: Programme découpé par année
              items: { $ref: "#/components/schemas/ProgramYear" }

    ProgramList:
      type: object
      required: [total, items]
      properties:
        total: { type: integer, example: 1 }
        items:
          type: array
          items: { $ref: "#/components/schemas/ProgramSummary" }

    # --------------------------------------------------------------- Écritures
    ProgramInput:
      type: object
      description: Colonnes `programs` en écriture. `career_names` et `course_names` créent ou réutilisent les lignes correspondantes.
      required: [name, institute_id, domain_id, degree, duration, tuition, career_names, course_names]
      properties:
        name: { type: string, example: "Sciences infirmières" }
        institute_id: { type: integer, example: 4 }
        domain_id: { type: string, example: sante }
        degree: { type: string, enum: [BTS, Licence, Licence pro, Master] }
        duration: { type: integer, enum: [2, 3] }
        tuition: { type: integer, example: 650000 }
        bac_series: { type: string, nullable: true, example: "CD" }
        evening: { type: boolean, default: false }
        internship_months: { type: integer, default: 0 }
        installments: { type: boolean, default: false }
        career_names: { type: array, items: { type: string }, example: ["Infirmier"] }
        course_names: { type: array, items: { type: string }, example: ["Anatomie et physiologie", "Soins infirmiers de base"] }

    InstituteInput:
      type: object
      description: Colonnes `instituts` en écriture
      required: [name, short_name, district, phone, whatsapp, email, color, description, registration_fee, registration_deadline, start_date, accreditation_status]
      properties:
        name: { type: string, example: "Institut de Santé du Djoué" }
        short_name: { type: string, example: ISD }
        district:
          type: string
          enum: [Makelekele, Bacongo, Poto-Poto, Moungali, Ouenze, Talangai, Mfilou, Madibou, Djoue]
        address: { type: string, example: "Route du Djoué, Makélékélé", nullable: true }
        phone: { type: string, example: "+242 06 409 88 52" }
        whatsapp: { type: string, example: "242064098852" }
        email: { type: string, format: email, example: "contact@isd.cg" }
        color: { type: string, example: "#B03352" }
        image_url: { type: string, nullable: true, example: null }
        description: { type: string, example: "Métiers paramédicaux..." }
        registration_fee: { type: integer, example: 75000 }
        registration_deadline: { type: string, example: "27 sept." }
        start_date: { type: string, example: "20 oct. 2026" }
        accreditation_status: { type: string, enum: [agre, en_cours] }
        accreditation_number: { type: string, nullable: true, example: "N° 156/MESRTI/2012" }

