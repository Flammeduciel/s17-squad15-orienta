<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orienta Brazzaville - Les instituts privés de Brazzaville, au même endroit</title>
<meta name="description" content="Orienta centralise les formations, diplômes, frais, agréments et contacts des instituts privés de Brazzaville, pour aider les nouveaux bacheliers à choisir en connaissance de cause.">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --bg:#FFFFFF; --soft:#F3F5F2; --card:#FFFFFF; --ink:#14201B; --muted:#5E6B64; --line:#E1E5E0;
  --green:#17693F; --green-soft:#E3F0E8; --sun:#F0B415; --heart:#E0405A;
  --blue:#1D4ED8; --blue-soft:#E8F0FE;
  --wa:#1DA851;
  --shadow:0 6px 24px rgba(16,35,27,.10);
  --display:"Avenir Next","Segoe UI Semibold",ui-sans-serif,system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI","Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --soft:#18211C; --card:#141C18; --ink:#E9F0EB; --muted:#9DABA3; --line:#26322B;
  --green:#4FBF86; --green-soft:#1B3326; --sun:#F2C233; --heart:#FF6B82; --shadow:0 6px 24px rgba(0,0,0,.45);
  --blue:#93B4F5; --blue-soft:#1B2A44; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --soft:#18211C; --card:#141C18; --ink:#E9F0EB; --muted:#9DABA3; --line:#26322B;
  --green:#4FBF86; --green-soft:#1B3326; --sun:#F2C233; --heart:#FF6B82; --shadow:0 6px 24px rgba(0,0,0,.45);
  --blue:#93B4F5; --blue-soft:#1B2A44; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);margin:0}
a{color:inherit}
h1,h2,h3{margin:0;line-height:1.12;text-wrap:balance}
p{margin:0}
button{font-family:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding-inline:24px}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}

.top{background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;font:800 24px/1 var(--display);color:var(--green)}
.logo svg{width:32px;height:32px}
.top-actions{display:flex;align-items:center;gap:6px}
.lnk{font-weight:600;font-size:15px;padding:10px 14px;border-radius:99px;text-decoration:none;background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.lnk:hover{background:var(--soft)}
.lnk svg{width:20px;height:20px}
.lnk .badge{background:var(--heart);color:#fff;font-size:12px;min-width:20px;height:20px;border-radius:99px;display:inline-grid;place-items:center;padding:0 6px}

.hero{padding-block:40px 28px;text-align:center}
.hero h1{font:800 clamp(30px,4.6vw,52px)/1.05 var(--display);letter-spacing:-.02em}
.hero p{color:var(--muted);font-size:18px;margin-top:12px}
.search{margin:28px auto 0;max-width:900px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) auto;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:99px;box-shadow:var(--shadow);text-align:left;position:relative}
.sf{padding:12px 24px;border-radius:99px;position:relative;min-width:0}
.sf+.sf:before{content:"";position:absolute;left:0;top:22%;height:56%;border-left:1px solid var(--line)}
.sf:hover{background:var(--soft)}
.sf label{display:block;font-size:12px;font-weight:800;letter-spacing:.02em}
.sf input,.sf select{width:100%;border:0;background:transparent;font:500 15px/1.4 var(--body);color:var(--ink);padding:2px 0;outline:none;appearance:none;-webkit-appearance:none}
.sf select{cursor:pointer}
.sf input{cursor:text}
.sf input::placeholder{color:var(--muted)}
.go{margin:8px;height:52px;padding:0 22px;border-radius:99px;border:0;background:var(--green);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;cursor:pointer}
.go svg{width:18px;height:18px}
.go:hover{filter:brightness(1.1)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 10px);background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:8px;z-index:30;max-height:340px;overflow:auto}
.sugg button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:12px;cursor:pointer;font-size:15px}
.sugg button:hover,.sugg button.on{background:var(--soft)}
.sugg .ic{flex:none;width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center}
.sugg .ic svg{width:18px;height:18px}
.sugg small{display:block;color:var(--muted);font-size:13px}
.sugg h4{margin:6px 12px 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}

.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.cats .wrap{display:flex;gap:30px;overflow-x:auto;scrollbar-width:none}
.cats .wrap::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 2px 12px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;border-bottom:2px solid transparent;opacity:.85}
.cat svg{width:26px;height:26px}
.cat:hover{color:var(--ink);opacity:1;border-bottom-color:var(--line)}
.cat[aria-pressed="true"]{color:var(--ink);opacity:1;border-bottom-color:var(--ink)}

.access{margin:22px auto 0;max-width:900px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;text-align:left}
.acc{display:flex;gap:12px;align-items:center;min-width:0;border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit;text-align:left}
.acc svg{flex:none;width:24px;height:24px;color:var(--green)}
.acc b{display:block;font-size:16px}
.acc small{display:block;color:var(--muted);font-size:13px}
.acc:hover{border-color:var(--ink)}
.acc[aria-pressed="true"]{border-color:var(--green);box-shadow:inset 0 0 0 1.5px var(--green)}
.job small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.cover .big-sigle{position:relative;font:800 34px var(--display);letter-spacing:.03em}

.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:36px;padding-block:28px 64px}
.filters{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);max-height:calc(100vh - 110px);overflow:auto;padding-right:6px;scrollbar-width:thin}
.fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.fhead h2{font-size:20px;font-family:var(--display)}
.clear{background:none;border:0;text-decoration:underline;font-weight:600;cursor:pointer;font-size:14px;padding:4px}
.fgroup{border-bottom:1px solid var(--line);padding-block:18px}
.fgroup h3{font-size:16px;margin-bottom:12px}
.fgroup .hint{font-size:13px;color:var(--muted);margin:-8px 0 10px}
.check{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--green);margin:0;flex:none}
.check .n{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer}
.pill:hover{border-color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mfind{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;font:500 14px var(--body);margin-bottom:8px}
.mlist{max-height:210px;overflow:auto;padding-right:4px}
.range{width:100%;accent-color:var(--green)}
.rangeval{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:4px}
.rangeval b{color:var(--ink);font-variant-numeric:tabular-nums}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;cursor:pointer;font-size:15px}
.toggle small{display:block;color:var(--muted);font-size:13px}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;margin:0}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw:checked{background:var(--green)}
.sw:checked:after{left:21px}
select.plain{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;font:500 15px var(--body)}
.sheet-foot{display:none}

.rbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.rbar h2{font-size:18px;font-weight:700}
.rbar .r{display:flex;gap:10px;align-items:center}
.openf{display:none;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:14px}
.openf svg{width:16px;height:16px}
.sort{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:9px 14px;font:600 14px var(--body)}
.active-tags{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 18px}
.atag{display:inline-flex;align-items:center;gap:6px;background:var(--green-soft);border:0;border-radius:99px;padding:6px 10px 6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.atag span{font-size:15px;line-height:1}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 22px}
.fcard{position:relative;display:flex;flex-direction:column;gap:10px;text-decoration:none;min-width:0}
.cover{position:relative;aspect-ratio:20/19;max-width:100%;border-radius:16px;overflow:hidden;display:grid;place-items:center;color:#fff}
.cover .pat{position:absolute;inset:0;opacity:.18;background-image:radial-gradient(circle at 1px 1px,#fff 1.5px,transparent 0);background-size:18px 18px}
.cover .blob{position:absolute;width:70%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.12);right:-18%;bottom:-22%}
.cover svg.big{width:34%;height:34%;position:relative;opacity:.95}
.cover .dip{position:absolute;left:12px;top:12px;background:#fff;color:#14201B;font-size:13px;font-weight:800;padding:5px 10px;border-radius:99px}
.cover .inst{position:absolute;left:14px;bottom:12px;font:800 15px var(--display);letter-spacing:.04em;opacity:.9}
.fcard:hover .cover{filter:brightness(1.06)}
.heart{position:absolute;right:10px;top:10px;z-index:2;width:38px;height:38px;border:0;background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.heart svg{width:26px;height:26px;fill:rgba(0,0,0,.35);stroke:#fff;stroke-width:2;transition:transform .15s}
.heart:hover svg{transform:scale(1.1)}
.heart[aria-pressed="true"] svg{fill:var(--heart)}
.fcard .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.fcard h3{font-size:16px;font-weight:700}
.fcard .dur{flex:none;font-size:14px;color:var(--muted)}
.fcard .meta{font-size:14px;color:var(--muted);margin-top:-6px}
.fcard .jobs{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fcard .jobs b{color:var(--ink);font-weight:600}
.fcard .price{font-size:15px}
.fcard .price b{font-weight:800}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;border:1px dashed var(--line);border-radius:18px}
.empty h3{font-size:20px;margin-bottom:8px}
.empty p{color:var(--muted);margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:700 16px/1 var(--body);padding:15px 22px;border-radius:12px;text-decoration:none;background:var(--green);color:#fff}
.btn:hover{filter:brightness(1.1)}
.btn.line{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.wa{background:var(--wa)}
.btn.sm{padding:8px 12px;font-size:13px}
.agb{display:inline-flex;align-items:center;gap:5px;background:var(--blue-soft);color:var(--blue);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800}
.agb svg{width:13px;height:13px}
.agb.p{background:var(--soft);color:var(--muted)}
.sec{margin-top:36px}
.sec h2{font:800 22px var(--display);margin-bottom:14px}


.detail{padding-block:24px 80px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;text-decoration:none;font-size:15px;padding:6px 0}
.dtitle{margin-top:14px;display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.dtitle h1{font:800 clamp(28px,3.8vw,40px)/1.08 var(--display);letter-spacing:-.01em}
.dtitle .sub{color:var(--muted);margin-top:8px;font-size:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dtitle .sub b{color:var(--ink)}
.dcover{margin-top:22px;height:300px;border-radius:22px;display:grid;place-items:center;overflow:hidden}
.dcover .big-sigle{font:800 clamp(40px,7vw,72px) var(--display);color:#fff;letter-spacing:.03em}
.dcover svg.big{width:120px;height:120px}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:64px;margin-top:36px;align-items:start}
.dmain{min-width:0}
.dmain section{padding-block:30px;border-bottom:1px solid var(--line)}
.dmain section:first-child{padding-top:0}
.dmain h2{font:800 22px var(--display);margin-bottom:18px}
.dmain a.ilnk{color:var(--green);text-decoration:underline;font-weight:700}
.highlights{display:grid;gap:18px}
.hl{display:flex;gap:16px;align-items:flex-start}
.hl svg{flex:none;width:26px;height:26px;margin-top:2px}
.hl b{display:block}
.hl span{color:var(--muted);font-size:15px}
.years{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.year{border:1px solid var(--line);border-radius:14px;padding:16px}
.year h3{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}
.year ul{margin:0;padding-left:18px;display:grid;gap:4px}
.jobgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.job{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:600;text-decoration:none;background:var(--card);cursor:pointer;font-size:15px;text-align:left}
.job:hover{border-color:var(--ink)}
.job svg{flex:none;width:22px;height:22px;color:var(--green)}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.checklist li{display:flex;gap:12px}
.checklist li:before{content:"";flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--green);margin-top:2px}
.instbox{display:flex;gap:16px;align-items:center}
.instlogo{flex:none;width:64px;height:64px;border-radius:16px;display:grid;place-items:center;color:#fff;font:800 17px var(--display)}
.instbox p{color:var(--muted);font-size:15px}
.minigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:18px}
.mini{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none}
.mini:hover{border-color:var(--ink)}
.mini small{color:var(--muted)}
.book{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow);background:var(--card);display:grid;gap:14px}
.book .p{font-size:15px;color:var(--muted)}
.book .p b{font:800 26px var(--display);color:var(--ink)}
.lines{display:grid;gap:8px;font-size:15px}
.lines div{display:flex;justify-content:space-between;gap:10px}
.lines .tot{border-top:1px solid var(--line);padding-top:10px;font-weight:800}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.dates{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dates div{padding:10px 12px}
.dates div+div{border-left:1px solid var(--line)}
.dates small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.fld label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 12px;font:500 15px var(--body)}
.fld textarea{min-height:90px;resize:vertical}
.phone{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.phone span{font-weight:700;user-select:all}
.copy{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px;cursor:pointer}
.ok{background:var(--green-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.err{background:var(--heart);color:#fff;border-radius:12px;padding:12px 14px;font-size:14px}
.mbar{display:none}

.about{max-width:820px;margin:0 auto;padding-block:40px 80px;display:grid;gap:22px}
.about h1{font:800 clamp(30px,4.4vw,44px)/1.05 var(--display)}
.about .lead{color:var(--muted);font-size:18px}
.about section{display:grid;gap:10px}
.about h2{font:800 22px var(--display)}
.about p{color:var(--muted);font-size:16px}
.about p b{color:var(--ink)}

.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
.tbl tr:last-child td{border-bottom:0}
.tblwrap{overflow:auto;border-radius:14px}

footer{border-top:1px solid var(--line);background:var(--soft);padding-block:26px;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:inherit;text-decoration:underline}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}

@media (max-width:1000px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .openf{display:inline-flex}
  .filters{position:fixed;z-index:50;left:0;right:0;bottom:0;top:auto;max-height:86vh;background:var(--bg);border-radius:22px 22px 0 0;padding:20px 20px 0;transform:translateY(105%);transition:transform .25s;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
  .filters.open{transform:none}
  .sheet-foot{display:flex;position:sticky;bottom:0;background:var(--bg);padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);justify-content:space-between;align-items:center;margin-top:8px}
  .dgrid{grid-template-columns:minmax(0,1fr);gap:0}
  .book{position:static;box-shadow:none;margin-top:30px}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));justify-content:space-between;align-items:center;gap:12px}
  .mbar b{font-size:17px}
  .mbar small{display:block;color:var(--muted)}
}
@media (max-width:760px){
  .wrap{padding-inline:16px}
  .hero{padding-block:24px 18px;text-align:left}
  .hero p{font-size:16px}
  .search{grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-radius:22px;padding:6px}
  .sf{border-radius:14px;padding:10px 14px}
  .sf.q{grid-column:1/-1;border-bottom:1px solid var(--line);border-radius:14px 14px 0 0}
  .sf+.sf:before{display:none}
  .sf.dip{border-left:1px solid var(--line);border-radius:0}
  .go{grid-column:1/-1;justify-content:center;margin:6px 0 0}
  .top-actions .hide-s{display:none}
  .cats .wrap{gap:22px}

/* ---------- Modèle ---------- */
function buildAnnees(f){
  const lab = Array.from({length:f.duree||1}, (_,k)=> f.dip==="Master" ? "M"+(k+1) : (k ? (k+1)+"e" : "1re")+" année");
  /* Le programme saisi année par année dans le back-office fait foi ; à défaut,
     les cours sont répartis à parts égales. */
  const per = Math.max(1, Math.ceil(f.cours.length/lab.length));
  const annees = lab.map((l,k)=>[l, f.programme ? (f.programme[k]||[]).slice() : f.cours.slice(k*per,(k+1)*per)]).filter(a=>a[1].length);
  if(f.stage && annees.length) annees[annees.length-1][1].push("Stage en entreprise ("+f.stage+" mois)");
  return annees;
}

  const f = Object.assign({}, o, {series: Array.isArray(o.series) ? o.series : String(o.series||"").split("")});

  return f;
}

/* ---------- État ---------- */

let favs = new Set(store.get("orienta-favs",[]));
let V = store.get("orienta-visits",{});       /* popularité - compatible avec l'accès anonyme */
let REC = store.get("orienta-recent",[]);      /* consultées récemment */

function track(id){
  V[id] = (V[id]||0)+1; store.set("orienta-visits",V);
  REC = [id].concat(REC.filter(x=>x!==id)).slice(0,8); store.set("orienta-recent",REC);
}

function matches(f, skip){
  const i = INST[f.inst];
  if(skip!=="q" && S.q){
    const hay = norm([f.nom,f.jobs.join(" "),f.cours.join(" "),i.nom,i.sigle,DOM[f.dom].nom,f.dip].join(" "));
    if(!norm(S.q).split(/\s+/).filter(Boolean).every(w=>hay.includes(w))) return false;
  }
  if(skip!=="cat" && S.cat && f.dom!==S.cat) return false;
  if(skip!=="metiers" && S.metiers.length && !S.metiers.some(m=>f.jobs.includes(m))) return false;
  if(skip!=="dips" && S.dips.length && !S.dips.includes(f.dip)) return false;
  if(skip!=="durees" && S.durees.length && !S.durees.includes(f.duree)) return false;
  if(S.budget<MAXF && f.frais > S.budget) return false;
  if(skip!=="arrondissements" && S.arrondissements.length && !S.arrondissements.includes(i.arr)) return false;
  /* Sans série rattachée, une formation est ouverte à toutes les séries, sauf un Master (post-licence). */
  if(S.serie && !(f.series.length ? f.series.includes(S.serie) : f.dip!=="Master")) return false;
  if(S.soir && !f.soir) return false;
  if(S.stage && !f.stage) return false;
  if(S.tranches && !f.tranches) return false;
  if(S.fav && !favs.has(f.id)) return false;
  return true;
}
function results(){
  const r = F.filter(f=>matches(f));
  if(S.sort==="prix") r.sort((a,b)=>a.frais-b.frais);
  if(S.sort==="prixd") r.sort((a,b)=>b.frais-a.frais);
  if(S.sort==="duree") r.sort((a,b)=>a.duree-b.duree||a.frais-b.frais);
  return r;
}
/* Instituts à afficher : ceux qui ont au moins une formation correspondant aux
   filtres ; sans filtre de formation, tous les instituts (liste exhaustive). */
function instResults(){
  const formOnly = S.cat||S.fav||S.metiers.length||S.dips.length||S.durees.length||S.budget<MAXF||S.serie||S.soir||S.stage||S.tranches;
  const words = norm(S.q).split(/\s+/).filter(Boolean);
  return Object.keys(INST).filter(id=>{
    const i = INST[id];
    if(F.some(f=>f.inst===id && matches(f))) return true;
    if(formOnly) return false;
    if(S.arrondissements.length && !S.arrondissements.includes(i.arr)) return false;
    const hay = norm([i.nom,i.sigle,i.arr].join(" "));
    return words.every(w=>hay.includes(w));
  });
}
function pick(key, val){
  const save = S[key];
  S[key] = [val];
  const r = F.filter(f=>matches(f));
  S[key] = save; return r;
}
const nActive = () => S.metiers.length+S.dips.length+S.durees.length+S.arrondissements.length+(S.budget<MAXF)+(!!S.serie)+S.soir+S.stage+S.tranches;
function countFor(key, val){
  const save = S[key];
  S[key] = [val];
  const n = F.filter(f=>matches(f)).length;
  S[key] = save; return n;
}

}

    + (others.length?'<h3 style="margin-top:24px;font-size:16px">Autres formations de '+esc(i.sigle)+'</h3><div class="minigrid">'+others.map(o=>'<a class="mini" href="#f-'+o.id+'"><b>'+esc(o.nom)+'</b><small>'+esc(o.dip)+' · '+ans(o.duree)+' · '+fcfa(o.frais)+'/an</small></a>').join("")+'</div>':"")
    + '</section>'
    + (similar.length?'<section style="border-bottom:0"><h2>Formations similaires ailleurs</h2><div class="minigrid">'+similar.map(o=>'<a class="mini" href="#f-'+o.id+'"><b>'+esc(o.nom)+'</b><small>'+esc(INST[o.inst].sigle)+' · '+esc(INST[o.inst].arr)+' · '+fcfa(o.frais)+'/an</small></a>').join("")+'</div></section>':"")
    + '</div>'
    + '<aside class="book" id="book">'
    + '<p class="p"><b class="num">'+fcfa(f.frais)+'</b> / an</p>'
    + agb(i)
    + '<div class="dates"><div><small>Inscriptions jusqu\'au</small>'+esc(i.clot)+'</div><div><small>Rentrée</small>'+esc(i.rentree)+'</div></div>'
    + '<div class="lines"><div><span>Scolarité 1re année</span><span class="num">'+fcfa(f.frais)+'</span></div><div><span>Frais d\'inscription</span><span class="num">'+fcfa(i.insc)+'</span></div><div class="tot"><span>Total à prévoir</span><span class="num">'+fcfa(f.frais+i.insc)+'</span></div></div>'
    + '<a class="btn wa" href="'+waLink(i,waMsg)+'" target="_blank" rel="noopener">WhatsApp - message pré-rempli</a>'
    + '<div class="phone"><div><small style="color:var(--muted);display:block">Secrétariat</small><span>'+esc(i.tel)+'</span></div><button class="copy" type="button" data-copy="'+esc(i.tel)+'">Copier</button></div>'
    + '<a class="btn line" href="'+mailLink(i,"Demande d'informations - "+f.nom)+'">Écrire par e-mail</a>'
    + '<form id="ask" style="display:grid;gap:12px">'
    + '<div class="fld"><label for="a-nom">Ton nom</label><input id="a-nom" required placeholder="ex. Grâce Mabiala"></div>'
    + '<div class="fld"><label for="a-mail">Ton e-mail</label><input id="a-mail" type="email" required placeholder="ton.adresse@email.com"></div>'
    + '<div class="fld"><label for="a-msg">Ta question</label><textarea id="a-msg" required placeholder="ex. Reste-t-il des places ? Peut-on visiter l\'institut ?"></textarea></div>'
    + '<button class="btn" type="submit">Envoyer ma question à '+esc(i.sigle)+'</button>'
    + '<div class="ok" id="ask-ok" hidden></div>'
    + '</form></aside></div></div>'
    + '<div class="mbar"><div><b class="num">'+fcfa(f.frais)+'</b> / an<small>Rentrée '+esc(i.rentree)+'</small></div><a class="btn" href="#book" id="tobook">Contacter</a></div>';
}

/* ---------- Fiche institut (EX-04) ---------- */
function pageInst(id){
  const i = INST[id];
  const forms = F.filter(f=>f.inst===id);
  const dips = [...new Set(forms.map(f=>f.dip))];
  const jobs = [...new Set(forms.flatMap(f=>f.jobs))].sort((a,b)=>a.localeCompare(b,"fr"));
  return '<div class="wrap detail">'
    + '<a class="back" href="#accueil">'+icon("back").replace('<svg','<svg width="18" height="18"')+'Retour aux résultats</a>'
    + '<div class="dtitle"><div><h1>'+esc(i.nom)+'</h1>'
    + '<p class="sub"><b>'+esc(i.sigle)+'</b> · '+esc(i.arr)+', Brazzaville'+(agb(i)?' · '+agb(i):'')+'</p></div></div>'
    + '<div class="dcover" style="background:'+i.c+';position:relative">'+(photo(i) || '<span class="big-sigle">'+esc(i.sigle)+'</span>')+'</div>'
    + '<div class="dmain" style="margin-top:36px">'
    + '<section><h2>Présentation</h2><p style="max-width:70ch">'+esc(i.desc)+'</p></section>'
    + (i.avantages && i.avantages.length ? '<section><h2>Avantages</h2><ul class="checklist">'+i.avantages.map(a=>'<li>'+esc(a)+'</li>').join("")+'</ul></section>' : "")
    + '<section><h2>Coordonnées et inscriptions</h2><div class="lines" style="max-width:560px">'
    + '<div><span>Adresse</span><span>'+esc(i.adr)+', Brazzaville</span></div>'
    + '<div><span>Téléphone</span><span class="num">'+esc(i.tel)+'</span></div>'
    + '<div><span>E-mail</span><a class="ilnk" href="'+mailLink(i,"Demande d'informations")+'">'+esc(i.mail)+'</a></div>'
    + '<div><span>Frais d\'inscription</span><span class="num">'+fcfa(i.insc)+'</span></div>'
    + '<div><span>Clôture des inscriptions</span><span>'+esc(i.clot)+'</span></div>'
    + '<div class="tot"><span>Rentrée</span><span>'+esc(i.rentree)+'</span></div>'
    + '</div>'
    + '<div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">'
    + '<a class="btn wa" href="'+waLink(i,"Bonjour "+i.sigle+", je souhaite obtenir des informations sur vos formations.")+'" target="_blank" rel="noopener">WhatsApp - message pré-rempli</a>'
    + '<a class="btn line" href="'+mailLink(i,"Demande d'informations")+'">Écrire par e-mail</a>'
    + '<a class="btn line" href="tel:'+esc(i.tel.replace(/\s/g,""))+'">Appeler</a>'
    + '</div></section>'
    + (forms.length ? '<section><h2>Diplômes délivrés et débouchés</h2><div class="pills">'+dips.map(d=>'<span class="pill" style="cursor:default">'+esc(d)+'</span>').join("")+'</div>'
      + '<div class="jobgrid" style="margin-top:16px">'+jobs.map(j=>'<button class="job" type="button" data-job="'+esc(j)+'">'+icon("brief")+esc(j)+'</button>').join("")+'</div></section>'
      + '<section><h2>Tarifs et conditions d\'admission</h2><div class="tblwrap"><table class="tbl"><thead><tr><th>Formation</th><th>Diplôme</th><th>Durée</th><th>Frais par an</th><th>Admission</th></tr></thead><tbody>'
      + forms.map(f=>'<tr><td><a class="ilnk" href="#f-'+f.id+'">'+esc(f.nom)+'</a></td><td>'+esc(f.dip)+'</td><td>'+ans(f.duree)+'</td><td class="num">'+tarifsTxt(f)+'</td><td>'+esc(admission(f))+'</td></tr>').join("")
      + '</tbody></table></div></section>' : "")
    + '<section style="border-bottom:0"><h2>Formations proposées ('+forms.length+')</h2><div class="grid" style="margin-top:8px">'+(forms.length?forms.map(card).join(""):'<div class="empty"><h3>Aucune formation publiée</h3><p>La Squad n\'a pas encore saisi les formations de cet institut.</p></div>')+'</div></section>'
    + '</div></div>';
}

/* ---------- À propos ---------- */
function pageAbout(){
  return '<div class="wrap"><div class="about">'
    + '<a class="back" href="#accueil">'+icon("back").replace('<svg','<svg width="18" height="18"')+'Retour à l\'accueil</a>'
    + '<h1>Faire le bon choix d\'orientation, sans courir la ville</h1>'
    + '<p class="lead">Orienta centralise l\'information sur les instituts privés de Brazzaville pour que chaque bachelier choisisse en connaissance de cause.</p>'
    + '<section><h2>Le problème</h2><p>Chaque année, des milliers de jeunes Congolais obtiennent leur baccalauréat et doivent choisir un institut supérieur. Mais une grande partie des instituts privés n\'a pas de site web : les familles doivent se déplacer d\'un établissement à l\'autre ou s\'en remettre au bouche-à-oreille, sans certitude sur les formations réellement proposées, les diplômes délivrés ou les frais pratiqués.</p></section>'
    + '<section><h2>Ce que fait Orienta</h2><p><b>Une fiche claire par formation</b> : diplôme préparé, durée, programme par année, métiers visés, frais détaillés et calendrier d\'inscription. <b>Un badge d\'agrément</b> affiché avec son numéro officiel pour chaque institut agréé. <b>Un contact direct</b> : WhatsApp, téléphone ou e-mail, sans créer de compte.</p></section>'
    + '<section><h2>Pour qui&nbsp;?</h2><p><b>Pour les nouveaux bacheliers et leurs familles</b>, qui peuvent comparer les offres à distance, gratuitement et sans inscription. <b>Pour les instituts sérieux</b> sans site web, qui gagnent en visibilité auprès des futurs étudiants - notre équipe collecte et vérifie l\'information avec eux, gratuitement.</p></section>'
    + '<section><h2>Notre engagement sur l\'information</h2><p>Chaque fiche est renseignée avec l\'institut lui-même et le numéro d\'agrément est recopié du document officiel communiqué par l\'établissement. Un institut non agréé apparaît sans badge : nous ne publions jamais d\'information que nous ne pouvons pas sourcer. Les tarifs et calendriers sont ceux communiqués par l\'institut et restent susceptibles d\'évoluer : le secrétariat de l\'établissement reste la référence finale.</p></section>'
    + '<div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="#accueil">Voir les instituts</a></div>'
    + '</div></div>';
}

/* ---------- Rendu & routage ---------- */
function syncFav(){
  const b = document.getElementById("favcount");
  if(!b) return;
  b.hidden = !favs.size; b.textContent = favs.size;
  document.getElementById("favbtn").setAttribute("aria-pressed", S.fav);
}
function render(){
  const h = (location.hash||"").slice(1);
  const app = document.getElementById("app");
  const f = h.indexOf("f-")===0 && F.find(x=>x.id===h.slice(2));
  const inst = h.indexOf("i-")===0 && INST[h.slice(2)] ? h.slice(2) : null;
  if(f){ track(f.id); app.innerHTML = pageDetail(f); document.title = f.nom+" · Orienta"; window.scrollTo(0,0); }
  else if(inst){ app.innerHTML = pageInst(inst); document.title = INST[inst].nom+" · Orienta"; window.scrollTo(0,0); }
  else if(h==="apropos"){ app.innerHTML = pageAbout(); document.title="À propos · Orienta"; window.scrollTo(0,0); }
  else if(h==="book"){ return; }
  else { app.innerHTML = pageHome(); document.title="Orienta Brazzaville"; update(); bindHome(); }
  syncFav();
}

function toResults(){
  const t = document.getElementById("top-results");
  if(t) window.scrollTo({top:t.offsetTop-80,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}

function bindHome(){
  const q = document.getElementById("s-q"), sugg = document.getElementById("sugg");
  const showSugg = () => {
    const v = norm(q.value.trim());
    if(!v){ sugg.hidden = true; return; }
    const jobs = METIERS.filter(m=>norm(m).includes(v)).slice(0,5);
    const forms = F.filter(x=>norm(x.nom).includes(v)||norm(DOM[x.dom].nom).includes(v)).slice(0,5);
    const insts = Object.entries(INST).filter(p=>norm(p[1].nom).includes(v)||norm(p[1].sigle).includes(v)).slice(0,3);
    if(!jobs.length && !forms.length && !insts.length){ sugg.hidden = true; return; }
    sugg.innerHTML = (insts.length?'<h4>Instituts</h4>'+insts.map(p=>'<button type="button" data-si="'+p[0]+'"><span class="ic">'+icon("cap")+'</span><span>'+esc(p[1].nom)+'<small>'+esc(p[1].arr)+'</small></span></button>').join(""):"")
      + (jobs.length?'<h4>Débouchés</h4>'+jobs.map(m=>'<button type="button" data-sj="'+esc(m)+'"><span class="ic">'+icon("brief")+'</span><span>'+esc(m)+'<small>'+F.filter(x=>x.jobs.includes(m)).length+' formation(s)</small></span></button>').join(""):"")
      + (forms.length?'<h4>Formations</h4>'+forms.map(x=>'<button type="button" data-sf="'+x.id+'"><span class="ic">'+icon(x.dom)+'</span><span>'+esc(x.nom)+'<small>'+esc(x.dip)+' · '+esc(INST[x.inst].sigle)+'</small></span></button>').join(""):"");
    sugg.hidden = false;
  };
  q.addEventListener("input", showSugg);
  q.addEventListener("focus", showSugg);
  document.addEventListener("click", e=>{ if(!e.target.closest(".sf.q")) sugg.hidden = true; });
  sugg.addEventListener("click", e=>{
    const j = e.target.closest("[data-sj]"), s = e.target.closest("[data-sf]"), si = e.target.closest("[data-si]");
    if(j){ S.metiers=[j.dataset.sj]; S.vue="form"; S.q=""; q.value=""; sugg.hidden=true; update(); toResults(); }
    if(s){ location.hash = "f-"+s.dataset.sf; }
    if(si){ location.hash = "i-"+si.dataset.si; }
  });
  document.getElementById("search").addEventListener("submit", e=>{
    e.preventDefault();
    S.q = q.value.trim();
    const a = document.getElementById("s-arr").value, di = document.getElementById("s-dip").value;
    S.arrondissements = a?[a]:[]; S.dips = di?[di]:[];
    sugg.hidden = true; update(); toResults();
  });
  document.querySelectorAll("[data-cat]").forEach(b=>b.addEventListener("click",()=>{
    S.cat = b.dataset.cat;
    document.querySelectorAll("[data-cat]").forEach(x=>x.setAttribute("aria-pressed", x===b));
    update();
  }));
  document.querySelectorAll("[data-vue]").forEach(b=>b.addEventListener("click",()=>{ S.vue = b.dataset.vue; update(); toResults(); }));
  document.getElementById("grid").addEventListener("click", e=>{
    const d = e.target.closest("[data-vdip]"), m = e.target.closest("[data-vdeb]");
    if(d){ S.dips=[d.dataset.vdip]; document.getElementById("s-dip").value=d.dataset.vdip; }
    if(m){ S.metiers=[m.dataset.vdeb]; }
    if(d || m){ S.vue="form"; update(); toResults(); }
  });
  document.getElementById("sort").addEventListener("change", e=>{ S.sort=e.target.value; renderGrid(); });
  const panel = document.getElementById("filters"), scrim = document.getElementById("scrim");
  const openP = o => { panel.classList.toggle("open",o); scrim.hidden=!o; document.body.style.overflow=o?"hidden":""; };
  document.getElementById("openf").onclick = ()=>openP(true);
  scrim.onclick = ()=>openP(false);
  panel.addEventListener("click", e=>{
    if(e.target.id==="closef") openP(false);
    const p = e.target.closest("[data-parr]");
    if(p){ const k=p.dataset.parr, v=k==="durees"?+p.dataset.v:p.dataset.v;
      S[k] = S[k].includes(v)?S[k].filter(x=>x!==v):S[k].concat([v]); update(); }
  });
  panel.addEventListener("change", e=>{
    const t = e.target;
    if(t.dataset.arr){ const k=t.dataset.arr; S[k] = t.checked?S[k].concat([t.value]):S[k].filter(x=>x!==t.value); update(); }
    if(t.dataset.bool){ S[t.dataset.bool]=t.checked; update(); }
    if(t.id==="serie"){ S.serie=t.value; update(); }
  });
  panel.addEventListener("input", e=>{
    if(e.target.id==="budget"){ S.budget=+e.target.value; document.getElementById("bval").textContent = S.budget>=MAXF?"Sans limite":fcfa(S.budget); renderGrid(); }
    if(e.target.id==="mfind"){ renderFilters(); }
  });
}

/* ---------- Événements globaux ---------- */
document.addEventListener("click", function(e){
  const fav = e.target.closest("[data-fav]");
  if(fav){
    e.preventDefault();
    const id = fav.dataset.fav;
    if(favs.has(id)) favs.delete(id); else favs.add(id);
    store.set("orienta-favs",[...favs]);
    const on = favs.has(id);
    document.querySelectorAll('[data-fav="'+id+'"]').forEach(function(b){
      b.setAttribute("aria-pressed",on);
      if(!b.classList.contains("heart")) b.textContent = on?"♥ Dans mes favoris":"♡ Ajouter aux favoris";
      else b.setAttribute("aria-label",(on?"Retirer des":"Ajouter aux")+" favoris");
    });
    syncFav(); if(S.fav) renderGrid();
    return;
  }
  if(e.target.closest("[data-clear]")){
    const keep = {cat:S.cat,sort:S.sort,fav:S.fav,vue:S.vue};
    Object.assign(S, fresh(), keep); S.q="";
    const i=document.getElementById("s-q"); if(i) i.value="";
    const qa=document.getElementById("s-arr"), da=document.getElementById("s-dip"); if(qa) qa.value=""; if(da) da.value="";
    update(); return;
  }
  const job = e.target.closest("[data-job]");
  if(job){ Object.assign(S, fresh()); S.metiers=[job.dataset.job]; S.vue="form"; location.hash="accueil"; setTimeout(toResults,50); return; }
  const cp = e.target.closest("[data-copy]");
  if(cp){
    const done=function(){cp.textContent="Copié";setTimeout(function(){cp.textContent="Copier"},1500)};
    const fb=function(){cp.textContent="Copié (démo)";setTimeout(function(){cp.textContent="Copier"},1500)};
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(cp.dataset.copy).then(done,fb); } else fb(); }catch(err){ fb(); }
    return;
  }
  if(e.target.id==="tobook"){ e.preventDefault(); const b=document.getElementById("book"); if(b) b.scrollIntoView({behavior:"smooth"}); return; }
  if(e.target.closest("#favbtn")){
    S.fav = !S.fav; if(S.fav) S.vue="form";
    if(location.hash && location.hash.indexOf("#accueil")!==0){ location.hash="accueil"; }
    else { syncFav(); update(); toResults(); }
    return;
  }
  if(e.target.closest("#themebtn")){
    const dark = document.documentElement.getAttribute("data-theme")==="dark";
    document.documentElement.setAttribute("data-theme", dark?"light":"dark");
    store.set("orienta-theme", dark?"light":"dark");
    return;
  }
});

document.addEventListener("submit", function(e){
  if(e.target.id==="ask"){ e.preventDefault();
    const fid = location.hash.slice(2);
    const fm = F.find(function(x){return x.id===fid});
    const o=document.getElementById("ask-ok"); o.hidden=false;
    o.textContent="Version de démonstration : dans le site final, ta question et ton e-mail seront transmis directement au secrétariat de "+esc(INST[fm.inst].sigle)+". Aucun message n'a été envoyé.";
    return; }
});

/* Thème */
(function(){ const t=store.get("orienta-theme",null); if(t) document.documentElement.setAttribute("data-theme",t); })();

window.addEventListener("hashchange", render);
render();
</script>
