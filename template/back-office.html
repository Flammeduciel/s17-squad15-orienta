<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Espace Squad — Orienta Brazzaville</title>
<meta name="description" content="Back-office de Orienta Brazzaville : tableau de bord, instituts, formations, diplômes et débouchés.">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --bg:#FFFFFF; --soft:#F3F5F2; --card:#FFFFFF; --ink:#14201B; --muted:#5E6B64; --line:#E1E5E0;
  --green:#17693F; --green-soft:#E3F0E8; --sun:#F0B415; --heart:#E0405A;
  --blue:#1D4ED8; --blue-soft:#E8F0FE;
  --wa:#1DA851;
  --shadow:0 6px 24px rgba(16,35,27,.10);
  --display:"Avenir Next","Segoe UI Semibold",ui-sans-serif,system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI","Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --soft:#18211C; --card:#141C18; --ink:#E9F0EB; --muted:#9DABA3; --line:#26322B;
  --green:#4FBF86; --green-soft:#1B3326; --sun:#F2C233; --heart:#FF6B82; --shadow:0 6px 24px rgba(0,0,0,.45);
  --blue:#93B4F5; --blue-soft:#1B2A44; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --soft:#18211C; --card:#141C18; --ink:#E9F0EB; --muted:#9DABA3; --line:#26322B;
  --green:#4FBF86; --green-soft:#1B3326; --sun:#F2C233; --heart:#FF6B82; --shadow:0 6px 24px rgba(0,0,0,.45);
  --blue:#93B4F5; --blue-soft:#1B2A44; color-scheme:dark}

*{box-sizing:border-box}
a{color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.12;text-wrap:balance}
p{margin:0}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- Coquille ---------- */
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line);text-decoration:none}
.brand .mk{width:34px;height:34px;flex:none}
.brand b{font:800 20px/1.1 var(--display);color:var(--green);display:block}
.brand small{display:block;font:600 11.5px/1.3 var(--body);color:var(--muted);margin-top:2px;letter-spacing:.02em}
.navgroup{padding:18px 12px 2px}
.navgroup h4{margin:0 0 8px 10px;font:800 11px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.navitem{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;font:600 15px/1.3 var(--body);text-decoration:none;color:var(--ink)}
.navitem svg{flex:none;width:19px;height:19px;color:var(--muted)}
.navitem:hover{background:var(--soft)}
.navitem[aria-current="page"]{background:var(--green-soft);color:var(--green)}
.navitem[aria-current="page"] svg{color:var(--green)}
.navitem .ct{margin-left:auto;background:var(--heart);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:99px;display:inline-grid;place-items:center;padding:0 6px}
.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:14px 12px;display:grid;gap:6px}
.sidefoot .who{display:flex;align-items:center;gap:10px;padding:4px 8px 10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font:800 14px var(--display);flex:none}
.sidefoot .who b{font-size:14px;display:block;line-height:1.2}
.sidefoot .who small{color:var(--muted);font-size:12px}
.sidefoot .navitem{font-size:14px;padding:9px 12px}

.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:13px 28px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--ink)}
.crumbs b{color:var(--ink)}
.crumbs .sep{opacity:.5}
.baractions{display:flex;align-items:center;gap:6px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:9px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font:600 14px var(--body)}
.iconbtn:hover{background:var(--soft)}
.iconbtn svg{width:18px;height:18px}
.burger{display:none}

.page{padding:26px 28px 90px;display:grid;gap:22px;align-content:start;max-width:1400px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pagehead h1{font:800 clamp(24px,3vw,32px)/1.1 var(--display);letter-spacing:-.01em}
.pagehead p{color:var(--muted);margin-top:6px;max-width:70ch}

/* ---------- Boutons et champs (réutilisés du prototype public) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:700 15px/1 var(--body);padding:13px 20px;border-radius:12px;text-decoration:none;background:var(--green);color:#fff}
.btn:hover{filter:brightness(1.1)}
.btn.line{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.danger{background:var(--heart)}
.btn.ghost{background:none;color:var(--muted);box-shadow:none}
.btn.sm{padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--muted)}
.agb{display:inline-flex;align-items:center;gap:5px;background:var(--blue-soft);color:var(--blue);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800}
.agb svg{width:13px;height:13px}
.agb.p{background:var(--soft);color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.badge.new{background:var(--sun);color:#3A2B00}
.badge.ok{background:var(--green-soft);color:var(--green)}
.badge.wait{background:var(--soft);color:var(--muted)}
.badge.ko{background:var(--heart);color:#fff}
.pill{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer}
.pill:hover{border-color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.check{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--green);margin:0;flex:none}
.fld label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 12px;font:500 15px var(--body)}
.fld textarea{min-height:96px;resize:vertical}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green)}
.fld .hint{color:var(--muted);font-size:13px;margin-top:6px}
.fld.bad input,.fld.bad textarea,.fld.bad select{border-color:var(--heart);box-shadow:inset 0 0 0 1px var(--heart)}
.fld .err{display:block;color:var(--heart);font-size:13px;font-weight:600;margin-top:6px}
.ok{background:var(--green-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.err{background:var(--heart);color:#fff;border-radius:12px;padding:12px 14px;font-size:14px}

/* ---------- Blocs ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:14px}
.stat{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--card);display:grid;gap:7px}
.stat{min-width:0}
.stat .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;min-width:0}
.stat .row > div{min-width:0;flex:1}
.stat b{display:block;font:800 clamp(22px,6vw,30px)/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat small{display:block;color:var(--muted);font-weight:600;font-size:14px;overflow-wrap:break-word;margin-top:4px}
.stat .ico{flex:none;width:38px;height:38px;border-radius:11px;background:var(--green-soft);color:var(--green);display:grid;place-items:center}
.stat .ico svg{width:19px;height:19px}
.stat .ico.sun{background:#FBF0D6;color:#8A6100}
.stat .ico.blue{background:var(--blue-soft);color:var(--blue)}
.stat .ico.red{background:#FBE3E7;color:var(--heart)}
.panel{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.panel > header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:15px 18px;border-bottom:1px solid var(--line)}
.panel > header h2{font:800 18px var(--display)}
.panel > header small{color:var(--muted)}
.panel .pad{padding:18px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}

/* ---------- Barre d'outils et tableaux ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 15px;min-width:210px}
.field svg{width:17px;height:17px;color:var(--muted);flex:none}
.field input{border:0;background:none;outline:none;color:var(--ink);font:500 15px var(--body);width:100%;padding:0}
.field select{border:0;background:none;outline:none;color:var(--ink);font:500 15px var(--body);padding:0 2px;cursor:pointer}
.seg{display:flex;gap:4px;background:var(--soft);border-radius:99px;padding:4px}
.seg button{border:0;background:none;padding:7px 13px;border-radius:99px;cursor:pointer;font:600 13.5px var(--body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tblwrap{overflow:auto}
.tbl{width:100%;border-collapse:collapse;min-width:760px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--soft)}
.tbl .who{display:flex;align-items:center;gap:11px;min-width:220px}
.tbl .thumb{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:#fff;font:800 12px var(--display);flex:none;overflow:hidden}
.tbl .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tbl .who b{font-size:14.5px;display:block;line-height:1.25}
.tbl .who small{color:var(--muted);font-size:12.5px}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .acts{display:flex;gap:6px;justify-content:flex-end}
.act{border:1px solid var(--line);background:var(--card);border-radius:9px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.act:hover{background:var(--soft)}
.act svg{width:17px;height:17px}
.act.del:hover{background:var(--heart);color:#fff;border-color:var(--heart)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.pager .p{display:flex;gap:6px;align-items:center}
.empty{text-align:center;padding:56px 20px;border:1px dashed var(--line);border-radius:16px}
.empty h3{font:800 20px var(--display);margin-bottom:8px}
.empty p{color:var(--muted);margin-bottom:16px}

/* ---------- Listes de demandes ---------- */
.rows{display:grid;gap:12px}
.rowc{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:16px;display:grid;gap:12px}
.rowc .hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.rowc .who b{font-size:16px}
.rowc .who small{color:var(--muted);display:block;margin-top:3px}
.rowc .msg{color:var(--muted);max-width:78ch}
.rowc .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13.5px;align-items:center}
.rowc .foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kv{display:grid;gap:9px;font-size:14.5px}
.kv div{display:flex;justify-content:space-between;gap:14px}
.kv span:first-child{color:var(--muted)}
.kv b{font-weight:700;text-align:right}

/* ---------- Formulaires ---------- */
.form{display:grid;gap:20px}
.form .row{display:grid;gap:16px}
.form .two{grid-template-columns:1fr 1fr}
.form .three{grid-template-columns:repeat(3,1fr)}
fieldset{border:1px solid var(--line);border-radius:14px;padding:18px;margin:0;min-width:0}
legend{font:800 14px var(--display);padding:0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.formfoot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-top:4px}
.formfoot .sp{margin-left:auto}

/* ---------- Logo d'un institut ---------- */
.logoedit{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logoedit .ap{flex:none;width:104px;height:78px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;overflow:hidden;color:#fff;font:800 17px var(--display);background:var(--soft)}
.logoedit .ap img{width:100%;height:100%;object-fit:cover;background:#fff;display:block}
.logoedit .cmd{display:grid;gap:8px;justify-items:start;min-width:0}
.logoedit .cmd .hint{max-width:460px}

/* ---------- Connexion ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.login .art{background:var(--green);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.login .art h2{font:800 clamp(26px,3vw,38px)/1.1 var(--display)}
.login .art p{color:#D8EDE1;margin-top:12px;font-size:17px;max-width:46ch}
.login .art .pts{display:grid;gap:14px;margin-top:26px}
.login .art .pts div{display:flex;gap:11px;align-items:flex-start;font-size:15px}
.login .art .pts svg{flex:none;width:20px;height:20px;color:var(--sun)}
.login .formside{display:grid;place-items:center;padding:48px 24px}
.login .box{width:100%;max-width:400px;display:grid;gap:16px}
.login .box h1{font:800 30px/1.1 var(--display)}
.login .box > p{color:var(--muted)}
.loginfoot{color:#B9DAC9;font-size:14px}

/* ---------- Messages et fenêtres ---------- */
.toasts{position:fixed;right:20px;bottom:20px;z-index:80;display:grid;gap:10px}
.toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:13px 16px;font-weight:600;font-size:14px;box-shadow:var(--shadow);display:flex;gap:9px;align-items:center;animation:pop .18s ease-out}
.toast svg{flex:none;width:18px;height:18px}
.toast.bad svg{color:var(--heart)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:grid;place-items:center;padding:20px}
.modal .mbox{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:24px;max-width:450px;display:grid;gap:14px;width:100%}
.modal .mbox h3{font:800 20px var(--display)}
.modal .mbox p{color:var(--muted)}
.modal .mact{display:flex;gap:10px;justify-content:flex-end}
.foot{padding:22px 28px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}

@media (max-width:1080px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:60;left:0;top:0;bottom:0;width:280px;height:100vh;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .burger{display:inline-flex}
  .split{grid-template-columns:minmax(0,1fr)}
  .form .three{grid-template-columns:1fr 1fr}
}
@media (max-width:820px){
  .bar{padding-inline:18px}
  .page{padding:20px 18px 90px}
  .foot{padding-inline:18px}
  .form .two,.form .three{grid-template-columns:minmax(0,1fr)}
  .login{grid-template-columns:minmax(0,1fr)}
  .login .art{padding:30px 22px;gap:20px}
  .login .art .pts{display:none}
  .login .formside{padding:32px 20px 60px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.tarifs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tarifs label{font-weight:600;color:var(--muted)}
.deblist{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:8px}
.linkbtn{background:none;border:0;padding:0;color:var(--green);font:700 13.5px var(--body);cursor:pointer;text-decoration:underline}
.mbox .fld{margin:14px 0;text-align:left}
.fld .check{display:flex;font-size:15px;font-weight:500;margin:0}
.fld .check input{width:20px;height:20px;padding:0;flex:none}
.fld .err{background:none;padding:0;border-radius:0}
.programme{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.sergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:2px 14px}
.lien{display:grid;grid-template-columns:minmax(0,1fr) 150px 34px;gap:10px;align-items:center;margin-bottom:8px}
.attach{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--soft)}
.attach select{min-width:0;flex:1 1 180px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font:500 14px var(--body)}
@media (max-width:520px){ .lien{grid-template-columns:minmax(0,1fr) 34px} .lien .lien-forme{grid-column:1/-1} }
.programme .annee{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.programme ul{margin:8px 0 0;padding-left:18px;display:grid;gap:3px}
@media (max-width:520px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  /* L'icône sort du flux : le libellé dispose de toute la largeur de la carte. */
  .stat{padding:14px;position:relative}
  .stat .ico{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:9px}
  .stat b{padding-right:40px}
  .stat .ico svg{width:16px;height:16px}
  .stat small{font-size:13px}
}
@media (max-width:340px){
  .cards{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="modal"></div>

<script>
/* ---------- Icônes ---------- */
const P = {
  gauge:'<path d="M12 14 8 9"/><path d="M20.5 17a9 9 0 1 0-17 0"/><path d="M4 21h16"/>',
  inbox:'<path d="M3 12h5l2 3h4l2-3h5"/><path d="M5 5h14l2 7v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5l2-7Z"/>',
  users:'<path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7" r="3.5"/><path d="M21 20v-1.5a4 4 0 0 0-3-3.87M15.5 4.13a4 4 0 0 1 0 7.75"/>',
  cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/>',
  building:'<path d="M4 21V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v17M15 9h4a1 1 0 0 1 1 1v11M3 21h18M8 7h3M8 11h3M8 15h3"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  moon:'<path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10Z"/>',

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

const jdate = s => new Date(s).toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"});
const store = {
  get(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v===null?d:v }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} },
  del(k){ try{ localStorage.removeItem(k) }catch(e){} }
};

function toast(msg, bad){
  const box = document.getElementById("toasts");
  const t = document.createElement("div");
  t.className = "toast"+(bad?" bad":"");
  t.innerHTML = icon(bad?"x":"check")+esc(msg);
  box.appendChild(t);
  setTimeout(()=>t.remove(), 3800);
}

/* ---------- Données et persistance ---------- */
const ENREG = store.get("orienta-bo", null);
const DB = Object.assign({inst:{},formes:{},dips:null,dipDur:null,debs:null,cours:null,series:null,domaines:null}, ENREG||{});

/* Domaines d'insertion : référentiel {id, nom, c}. L'identifiant ne change jamais,
   donc renommer un domaine ne touche ni les formations ni les débouchés. */
const DOMAINES = (DB.domaines || DOMAINES_SEED).map(x=>Object.assign({},x));
const DOM = {};
function majDom(){ for(const k in DOM) delete DOM[k]; for(const x of DOMAINES) DOM[x.id] = x; }
majDom();
const usageDom = nom => { const x = DOMAINES.find(v=>v.nom===nom); return x ? Object.values(FORMES).filter(f=>f.dom===x.id).length : 0; };

/* Au premier lancement, tout vient du jeu de démonstration. Dès qu'un enregistrement
   existe, il fait foi : une entrée supprimée ne doit pas ressusciter au rechargement. */
const INST = {};
for(const s of INST_SEED){
  if(ENREG && !(s.id in DB.inst)) continue;
  INST[s.id] = Object.assign({avantages:[],logo:null}, s, DB.inst[s.id]||{});
}
const FORMES = {};
for(const r of FORMES_SEED){
  if(ENREG && !(r[0] in DB.formes)) continue;
  const [id,inst,dom,nom,dip,duree,frais,series,soir,stage,tranches,jobs,cours,statut] = r;
  FORMES[id] = Object.assign(
    {id,inst,dom,nom,dip,duree,frais,tarifs:Array(duree).fill(frais),series,admission:"",desc:"",soir:!!soir,stage,tranches:!!tranches,jobs:jobs.slice(),cours:cours.slice(),statut},
    DB.formes[id]||{}
  );
}
/* Un institut ou une formation créés dans le back-office n'ont pas d'équivalent
   dans le jeu de démonstration : ils viennent tels quels de l'enregistrement. */
for(const k in DB.inst) if(!INST[k]) INST[k] = Object.assign({avantages:[],logo:null}, DB.inst[k]);
for(const k in DB.formes) if(!FORMES[k]) FORMES[k] = Object.assign({tarifs:[],admission:"",desc:""}, DB.formes[k]);

/* Référentiels gérés par la Squad (EX-08) : diplômes et débouchés. */
const DIPS = DB.dips ? DB.dips.slice() : DIPS_SEED.slice();
const DEBS = DB.debs ? DB.debs.map(x=>Object.assign({},x)) : (function(){
  const m = {};
  for(const f of Object.values(FORMES)) for(const j of f.jobs) if(!m[j]) m[j] = {nom:j, secteur:f.dom};
  return Object.values(m);
})();
const usageDip = n => Object.values(FORMES).filter(f=>f.dip===n).length;
const usageDeb = n => Object.values(FORMES).filter(f=>f.jobs.includes(n)).length;
/* Séries du baccalauréat : référentiel {nom, lib}. Chaque formation porte la liste des séries admises. */
const SERIES = DB.series ? DB.series.map(x=>Object.assign({},x)) : SERIES_SEED.map(p=>({nom:p[0], lib:p[1]}));
for(const f of Object.values(FORMES)) if(!Array.isArray(f.series)) f.series = String(f.series||"").split("");
const usageSer = n => Object.values(FORMES).filter(f=>f.series.includes(n)).length;
/* Sans programme saisi année par année, les cours sont répartis à parts égales. */
const repartir = (cours, duree) => {
  const per = Math.max(1, Math.ceil(cours.length/Math.max(1,duree)));
  return Array.from({length:Math.max(1,duree)}, (_,k)=>cours.slice(k*per,(k+1)*per));
};
for(const f of Object.values(FORMES)) if(!f.programme) f.programme = repartir(f.cours||[], f.duree);

/* La durée des études est portée par le diplôme : elle s'impose aux formations qui le délivrent. */
const DUREE = DB.dipDur ? Object.assign({}, DB.dipDur) : {"BTS":2,"Licence":3,"Licence pro":3,"Master":2};
const dureeDip = (nom, defaut) => DUREE[nom] || defaut || 1;

/* Catalogue de cours partagé : un cours (Français, Mathématiques…) peut être
   rattaché à plusieurs formations, chacune avec son année d'études. */
const COURS = (function(){
  const parNom = {}, liste = [];
  const cours = nom => {
    const k = norm(nom);
    if(!parNom[k]){ parNom[k] = {id:"c"+(liste.length+1), nom, liens:[]}; liste.push(parNom[k]); }
    return parNom[k];
  };
  const lier = (c, forme, annee) => { if(!c.liens.some(l=>l.forme===forme)) c.liens.push({forme, annee}); };
  if(DB.cours) for(const x of DB.cours){
    /* Ancien enregistrement : un cours par formation, regroupé ici par intitulé. */
    if(x.liens) liste.push({id:x.id, nom:x.nom, liens:x.liens.map(l=>Object.assign({},l))});
    else lier(cours(x.nom), x.forme, x.annee);
  }
  else for(const f of Object.values(FORMES)) f.programme.forEach((noms,k)=>noms.forEach(nom=>lier(cours(nom), f.id, k+1)));
  return liste;
})();

/* Recalcule, pour chaque formation, ce qui découle du diplôme et des cours :
   durée, nombre de tarifs, programme par année. Le site public lit ce résultat. */
function majProgrammes(){
  for(const c of COURS) c.liens = c.liens.filter(l=>FORMES[l.forme]);
  for(const f of Object.values(FORMES)){
    f.duree = dureeDip(f.dip, f.duree);
    const tarifs = (f.tarifs||[]).slice(0, f.duree);
    while(tarifs.length < f.duree) tarifs.push(tarifs.length ? tarifs[tarifs.length-1] : f.frais);
    f.tarifs = tarifs;
    f.programme = Array.from({length:f.duree}, ()=>[]);
  }
  for(const c of COURS) for(const l of c.liens){
    const f = FORMES[l.forme];
    /* Un diplôme raccourci ramène les cours des années retirées sur la dernière année. */
    if(l.annee > f.duree) l.annee = f.duree;
    f.programme[l.annee-1].push(c.nom);
  }
  for(const f of Object.values(FORMES)) f.cours = f.programme.flat();
}
majProgrammes();

const S = {

  inst:{q:"",arr:"",ag:"",page:1,par:6},
  /* refl : diplôme, débouché ou série en cours de saisie, {type, nom} (nom nul = ajout). */

     conservée. */

  logoChoisi:false
};
/* Un numéro d'agrément est saisi tel quel ; vide ou « en cours » vaut absence d'agrément. */
const agrement = i => (i.ag && norm(i.ag).replace(/[\s.?!]/g,"")!=="encours") ? i.ag.trim() : "";

/* ---------- Filtres ---------- */
function filterForms(){
  const s = S.prog, q = norm(s.q);
  return Object.values(FORMES).filter(f=>{
    if(q){ const i = INST[f.inst]; if(!i) return false; const hay = norm([f.nom,f.jobs.join(" "),f.cours.join(" "),i.nom,i.sigle,DOM[f.dom].nom,f.dip].join(" ")); if(!q.split(/\s+/).filter(Boolean).every(w=>hay.includes(w))) return false; }
    if(s.dom && f.dom!==s.dom) return false;
    if(s.statut && f.statut!==s.statut) return false;
    return true;
  }).sort((a,b)=>a.nom.localeCompare(b.nom,"fr"));
}
function filterInst(){
  const s = S.inst, q = norm(s.q);
  return Object.values(INST).filter(i=>{
    if(q && !norm(i.nom+" "+i.sigle+" "+i.arr+" "+i.adr).includes(q)) return false;
    if(s.arr && i.arr!==s.arr) return false;
    if(s.ag==="oui" && !agrement(i)) return false;
    if(s.ag==="non" && agrement(i)) return false;
    return true;
  }).sort((a,b)=>a.sigle.localeCompare(b.sigle));
}

  deb:{h:"#/debouches", titre:"Débouchés", nom:"débouché", un:"un débouché", le:"le débouché", ce:"ce débouché", aucun:"Aucun débouché", ph:"ex. Comptable", usage:n=>usageDeb(n),
    intro:"Référentiel des débouchés professionnels, rattachés aux formations.", rows:()=>DEBS.slice().sort((a,b)=>a.nom.localeCompare(b.nom,"fr"))},

        + '</tbody></table></div>'

    [{t:"Espace Squad",h:"#/tableau-de-bord"},{t:"Catalogue"},{t:c.titre}]

}

/* ---------- Cours : catalogue partagé, rattaché aux formations ---------- */
const formesTriees = () => Object.values(FORMES).sort((a,b)=>libForme(a).localeCompare(libForme(b),"fr"));
const optFormes = sel => formesTriees().map(f=>'<option value="'+esc(f.id)+'"'+(sel===f.id?" selected":"")+'>'+esc(libForme(f))+' ('+esc(f.dip)+')</option>').join("");
const optAnnees = (formeId, sel) => {
  const f = FORMES[formeId];
  return Array.from({length:f ? f.duree : 1}, (_,k)=>'<option value="'+(k+1)+'"'+(sel===k+1?" selected":"")+'>'+niveau(k)+'</option>').join("");
};
/* Une ligne « formation + année » du formulaire d'un cours. */
const lienRow = l => '<div class="lien"><select class="lien-forme" aria-label="Formation">'+optFormes(l.forme)+'</select>'
  + '<select class="lien-annee" aria-label="Année d\'études">'+optAnnees(l.forme, l.annee)+'</select>'
  + '<button class="act del" type="button" data-act="lien-del" title="Retirer cette formation" aria-label="Retirer cette formation">'+icon("x")+'</button></div>';
function pageCours(){
  const s = S.cours, q = norm(s.q);
  if(s.forme && !FORMES[s.forme]) s.forme = "";
  const formes = formesTriees();
  const lienDe = c => c.liens.find(l=>l.forme===s.forme);
  const rows = COURS.filter(c=>(!s.forme || lienDe(c)) && (!q || norm(c.nom).includes(q)))
    .sort((a,b)=>(s.forme ? lienDe(a).annee-lienDe(b).annee : 0) || a.nom.localeCompare(b.nom,"fr"));
  s.page = Math.min(s.page, pages(rows.length, s.par));
  const slice = rows.slice((s.page-1)*s.par, s.page*s.par);
  const ed = S.coursEdit;
  const cur = ed && ed.id ? COURS.find(c=>c.id===ed.id) : null;
  const liens = (cur ? cur.liens : ed ? ed.liens : []).filter(l=>FORMES[l.forme]);
  const libres = s.forme ? COURS.filter(c=>!lienDe(c)).sort((a,b)=>a.nom.localeCompare(b.nom,"fr")) : [];
  return shell(
    '<div class="pagehead"><div><h1>Cours</h1><p>'+COURS.length+' cours au catalogue. Un même cours peut être rattaché à plusieurs formations, chacune avec son année d\'études.</p></div>'
    + (ed ? "" : '<button class="btn" type="button" data-act="cours-add">'+icon("plus")+'Ajouter un cours</button>')+'</div>'
    + (ed ? '<form class="form" id="cours-form" novalidate><fieldset><legend>'+(cur?"Modifier le cours":"Ajouter un cours")+'</legend>'
        + '<div class="row"><div class="fld" data-f="cnom"><label for="c-nom">Intitulé du cours</label><input id="c-nom" required value="'+esc(cur?cur.nom:"")+'" placeholder="ex. Français"></div></div>'
        + '<div class="row" style="margin-top:16px"><div class="fld" data-f="cliens"><label>Formations rattachées</label>'
        + '<div id="c-liens">'+liens.map(lienRow).join("")+'</div>'
        + (formes.length ? '<button class="btn line sm" type="button" data-act="lien-add">'+icon("plus")+'Rattacher à une formation</button>' : "")
        + '<span class="hint" style="display:block">Les années proposées viennent du diplôme de chaque formation. Un cours sans formation reste au catalogue.</span></div></div>'
        + '</fieldset><div class="formfoot"><button class="btn" type="submit">'+(cur?"Enregistrer les modifications":"Ajouter le cours")+'</button>'
        + '<button class="btn line" type="button" data-act="cours-cancel">'+(cur?"Annuler":"Terminer")+'</button></div></form>' : "")
    + '<div class="panel"><header><div class="toolbar">'
    + '<span class="field">'+icon("search")+'<input id="cq" type="search" placeholder="Rechercher un cours" value="'+esc(s.q)+'" aria-label="Rechercher"></span>'
    + '<select class="field" id="cforme" aria-label="Filtrer par formation"><option value="">Toutes les formations</option>'
    + formes.map(f=>'<option value="'+esc(f.id)+'"'+(s.forme===f.id?" selected":"")+'>'+esc(libForme(f))+'</option>').join("")+'</select>'
    + '</div><small>'+rows.length+' résultat'+(rows.length>1?"s":"")+'</small></header>'
    /* Formation filtrée : on peut lui rattacher directement un cours déjà au catalogue. */
    + (s.forme && libres.length ? '<div class="attach"><b style="font-size:14px">Rattacher un cours existant</b>'
        + '<select id="att-cours" aria-label="Cours à rattacher">'+libres.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.nom)+'</option>').join("")+'</select>'
        + '<select id="att-annee" aria-label="Année d\'études" style="flex:0 1 150px">'+optAnnees(s.forme, 1)+'</select>'
        + '<button class="btn sm" type="button" data-act="att-ok">'+icon("plus")+'Rattacher</button></div>' : "")
    + (slice.length
      ? '<div class="tblwrap"><table class="tbl"><thead><tr><th>Cours</th><th>'+(s.forme?"Année":"Formations rattachées")+'</th><th></th></tr></thead><tbody>'
        + slice.map(c=>{
            const noms = c.liens.map(l=>libForme(FORMES[l.forme]));
            return '<tr><td><b>'+esc(c.nom)+'</b></td>'
              + (s.forme ? '<td>'+niveau(lienDe(c).annee-1)+(c.liens.length>1?'<br><small style="color:var(--muted)">aussi dans '+(c.liens.length-1)+' autre'+(c.liens.length>2?"s":"")+' formation'+(c.liens.length>2?"s":"")+'</small>':"")+'</td>'

/* ---------- Pagination ---------- */
function pages(total, par){
  return Math.max(1, Math.ceil(total/par));
}
function pager(total, par, page){
  const n = pages(total,par);
  if(n<=1) return '<div class="pager"><span>'+total+' élément'+(total>1?"s":"")+'</span></div>';
  const debut = (page-1)*par+1, fin = Math.min(total, page*par);
  return '<div class="pager"><span>'+debut+' – '+fin+' sur '+total+'</span>'
    + '<span class="p"><button class="btn line sm" type="button" data-page="'+Math.max(1,page-1)+'"'+(page<=1?" disabled":"")+'>Précédent</button>'
    + '<b>Page '+page+' / '+n+'</b>'
    + '<button class="btn line sm" type="button" data-page="'+Math.min(n,page+1)+'"'+(page>=n?" disabled":"")+'>Suivant</button></span></div>';
}

/* ---------- Routage ---------- */
function render(){

  let out;
  if(S.refl && h!==REFL[S.refl.type].h) S.refl = null;
  if(S.coursEdit && h!=="#/cours") S.coursEdit = null;
  if(!isAuthed()) out = pageLogin();
  else if(h==="#/connexion") out = pageLogin();
  else if(h==="#/tableau-de-bord") out = pageDash();
  else if(h==="#/formations") out = pageFormes();
  else if(h==="#/formations/nouvelle") out = pageForme(null);
  else if(h.indexOf("#/formations/")===0) out = pageForme(h.slice(13));
  else if(h==="#/instituts") out = pageInsts();
  else if(h==="#/instituts/nouveau") out = pageInstEdit(null);
  else if(h.indexOf("#/instituts/")===0) out = pageInstEdit(h.slice(12));
  else if(h==="#/cours") out = pageCours();
  else if(h==="#/diplomes") out = pageRefl("dip");
  else if(h==="#/debouches") out = pageRefl("deb");

  /* Sur une fiche, l'image déjà enregistrée est celle proposée par défaut.
     Ailleurs, le brouillon est abandonné. */
  if(isAuthed() && /^#\/instituts\/[^/]+$/.test(h)){
    const i = INST[h.slice(12)];
    if(!S.logoChoisi) S.logoBrouillon = i && i.logo ? i.logo : null;

function bindLive(){
  const side = document.getElementById("side");

  const iq = document.getElementById("iq");
  if(iq) iq.addEventListener("input", deb(()=>{ S.inst.q=iq.value; S.inst.page=1; render(); const el=document.getElementById("iq"); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length);} },260));
  /* Un montant par année d'études ; la durée vient du diplôme choisi. */

  if(dipSel && tarifs){
    const f = FORMES[formeId()];
    const draw = ()=>{
      const n = dureeDip(dipSel.value, f ? f.duree : 1);
      document.getElementById("duree-txt").textContent = n+" an"+(n>1?"s":"");
      const saisis = Array.from(tarifs.querySelectorAll("input")).map(x=>x.value);
      tarifs.innerHTML = Array.from({length:n}, (_,k)=>{
        const v = saisis[k]!==undefined ? saisis[k]
          : f && f.tarifs && f.tarifs[k]!=null ? f.tarifs[k]
          : saisis.length ? saisis[saisis.length-1] : (f ? f.frais : 400000);
        return '<label>'+niveau(k)+'<input type="number" min="0" step="10000" value="'+esc(v)+'" aria-label="Frais '+niveau(k)+'"></label>';
      }).join("");
    };
    dipSel.addEventListener("change", draw);
    draw();
  }
  const cq = document.getElementById("cq");
  if(cq) cq.addEventListener("input", deb(()=>{ S.cours.q=cq.value; S.cours.page=1; render(); const el=document.getElementById("cq"); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length);} },260));
  const debFind = document.getElementById("deb-find");
  if(debFind) debFind.addEventListener("input", ()=>{
    const q = norm(debFind.value);
    document.querySelectorAll("#f-jobs .check").forEach(l=>{ l.style.display = q && !norm(l.textContent).includes(q) ? "none" : ""; });
  });
  const logoFile = document.getElementById("i-logo");
  if(logoFile) logoFile.addEventListener("change", ()=>{ if(logoFile.files[0]) lireLogo(logoFile.files[0]); });
  const instSel = document.getElementById("f-inst"), instHint = document.getElementById("inst-hint");
  if(instSel && instHint){
    instSel.addEventListener("change", ()=>{
      S.instCible = instSel.value;
      const n = Object.values(FORMES).filter(x=>x.inst===instSel.value).length;
      instHint.textContent = n+" formation"+(n>1?"s":"")+" déjà rattachée"+(n>1?"s":"")+" à cet institut.";
    });
  }
  logoApercu();
}
/* Un minuteur par champ : la recherche sur deux listes ne doit pas s'annuler. */
const debTimers = new WeakMap();
function deb(fn, ms){
  return function(){
    clearTimeout(debTimers.get(this));
    debTimers.set(this, setTimeout(fn, ms||200));
  };
}
/* Aperçu de l'image dans le formulaire d'un institut. */
function logoApercu(){
  const box = document.getElementById("logo-edit");
  if(!box) return;

    + '</div><span class="hint">JPEG, PNG ou WebP, 2 Mo maximum. L\'image est redimensionnée puis affichée sur la fiche publique de l\'institut.</span></div>';
}

/* Le fichier est lu localement puis réduit : il doit tenir dans le stockage du
   navigateur avec le reste de la démonstration. */
function lireLogo(f){
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)){ toast("Format non accepté : utilisez JPEG, PNG ou WebP.", true); return; }
  if(f.size > 2*1024*1024){ toast("Image trop lourde : 2 Mo maximum.", true); return; }
  const r = new FileReader();
  r.onload = ()=>{
    const im = new Image();
    im.onload = ()=>{
      const k = Math.min(1, 1000/Math.max(im.width, im.height));
      const c = document.createElement("canvas");
      c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(im,0,0,c.width,c.height);
      S.logoBrouillon = c.toDataURL("image/jpeg",0.82);
      S.logoChoisi = true;
      logoApercu();
      toast("Image prête. Enregistrez la fiche pour l\'appliquer.");
    };
    im.onerror = ()=>toast("Image illisible : essayez un autre fichier.", true);
    im.src = r.result;
  };
  r.readAsDataURL(f);
}

/* ---------- Validation ---------- */
function fail(name, msg){
  const f = document.querySelector('[data-f="'+name+'"]');
  if(f){
    f.classList.add("bad");
    let e = f.querySelector(".err");
    if(!e){ e = document.createElement("span"); e.className = "err"; f.appendChild(e); }
    e.textContent = msg;
  }
  return false;
}
function clearFailures(){
  document.querySelectorAll(".fld.bad").forEach(f=>{
    f.classList.remove("bad");
    const e = f.querySelector(".err"); if(e) e.remove();
  });
}
const lines = v => String(v||"").split("\n").map(s=>s.trim()).filter(Boolean);

document.addEventListener("keydown", function(e){

document.addEventListener("click", function(e){
  const t = e.target;

  const md = t.closest("[data-modal]");
  if(md){
    const p = md.dataset.payload || "";
    const ok = md.dataset.modal === "ok";
    closeModal();
    if(!ok) return;
    if(p==="reset"){ resetAll(); return; }
    if(p.indexOf("forme:")===0){
      const id = p.slice(6);
      const nom = FORMES[id] ? FORMES[id].nom : "";
      delete FORMES[id];
      saveBO();
      toast("Formation « "+nom+" » supprimée du catalogue.");
      render();
      return;
    }
    if(p.indexOf("inst:")===0){
      const id = p.slice(5);
      const i = INST[id];
      const n = Object.values(FORMES).filter(f=>f.inst===id).length;
      for(const k in FORMES) if(FORMES[k].inst===id) delete FORMES[k];
      delete INST[id];
      saveBO();
      toast("Institut supprimé"+(n?" avec "+n+" formation(s) rattachée(s)." : "."));
      render();
      return;
    }
    if(p.indexOf("cours:")===0){
      const k = COURS.findIndex(c=>c.id===p.slice(6));
      if(k<0) return;
      const nom = COURS[k].nom;
      COURS.splice(k,1);
      if(S.coursEdit && S.coursEdit.id===p.slice(6)) S.coursEdit = null;
      saveBO();
      toast("Cours « "+nom+" » supprimé du catalogue.");
      render();
      return;
    }
    if(p[3]===":" && REFL[p.slice(0,3)]){
      const type = p.slice(0,3), nom = p.slice(4);
      if(type==="dip"){ const k = DIPS.indexOf(nom); if(k>=0) DIPS.splice(k,1); delete DUREE[nom]; }
      else { const liste = type==="deb" ? DEBS : type==="ser" ? SERIES : DOMAINES; const k = liste.findIndex(x=>x.nom===nom); if(k>=0) liste.splice(k,1); majDom(); }
      saveBO();
      toast("« "+nom+" » supprimé du référentiel.");
      render();
      return;
    }
    return;
  }

  const nav = t.closest("[data-act]");
  if(nav){
    const a = nav.dataset.act;
    if(a==="theme"){
      const dark = document.documentElement.getAttribute("data-theme")==="dark";
      document.documentElement.setAttribute("data-theme", dark?"light":"dark");
      store.set("orienta-theme", dark?"light":"dark");
      return;
    }
    if(a==="logout"){ store.del("orienta-bo-session"); SESSION=null; location.hash="#/connexion"; render(); toast("Session fermée."); return; }
    if(a==="side"){ S.sideOpen = !S.sideOpen; const s=document.getElementById("side"); if(s) s.classList.toggle("open", S.sideOpen); return; }
    if(a==="reset-f"){ S.prog = {q:"",dom:"",statut:"",page:1,par:8}; render(); return; }
    if(a==="reset-i"){ S.inst = {q:"",arr:"",ag:"",page:1,par:6}; render(); return; }
    if(a==="reset-all"){
      confirmBox("Réinitialiser la démonstration","Toutes les modifications enregistrées dans ce navigateur seront perdues.", "reset");
      return;
    }
    if(a==="del-forme"){
      const f = FORMES[nav.dataset.id];
      if(f) confirmBox("Supprimer cette formation ?","« "+f.nom+" » disparaîtra du site public. Cette action est définitive.", "forme:"+f.id);
      return;
    }
    if(a==="del-inst"){
      const i = INST[nav.dataset.id];
      const n = i ? Object.values(FORMES).filter(f=>f.inst===i.id).length : 0;
      if(i) confirmBox("Supprimer cet institut ?","« "+i.nom+" » sera retiré"+(n?" ainsi que "+n+" de ses formations" : "")+". Cette action est définitive.", "inst:"+i.id);
      return;
    }
    if(a==="forgot"){ forgotBox(); return; }
    /* Lien posé sur une fiche formation : la liste des cours s'ouvre filtrée sur elle. */
    if(a==="cours-de"){ S.cours = {q:"",forme:nav.dataset.id,page:1,par:10}; }
    if(a==="cours-add"){ S.coursEdit = {id:null, liens:S.cours.forme ? [{forme:S.cours.forme, annee:1}] : []}; render(); const el=document.getElementById("c-nom"); if(el) el.focus(); return; }
    if(a==="cours-edit"){ S.coursEdit = {id:nav.dataset.id, liens:[]}; render(); window.scrollTo(0,0); return; }
    if(a==="cours-cancel"){ S.coursEdit = null; render(); return; }
    if(a==="lien-add"){
      const pris = Array.from(document.querySelectorAll(".lien-forme")).map(x=>x.value);
      const libre = formesTriees().find(f=>!pris.includes(f.id));
      if(!libre){ toast("Ce cours est déjà rattaché à toutes les formations.", true); return; }
      document.getElementById("c-liens").insertAdjacentHTML("beforeend", lienRow({forme:libre.id, annee:1}));
      return;
    }
    if(a==="lien-del"){ nav.closest(".lien").remove(); return; }
    if(a==="att-ok"){
      const c = COURS.find(x=>x.id===document.getElementById("att-cours").value), f = FORMES[S.cours.forme];
      if(!c || !f) return;
      c.liens.push({forme:f.id, annee:+document.getElementById("att-annee").value});
      saveBO();
      toast("« "+c.nom+" » rattaché à « "+f.nom+" ».");
      render();
      return;
    }
    if(a==="cours-detach"){
      const c = COURS.find(x=>x.id===nav.dataset.id);
      if(!c) return;
      c.liens = c.liens.filter(l=>l.forme!==S.cours.forme);
      saveBO();
      toast("« "+c.nom+" » retiré de cette formation. Il reste au catalogue.");
      render();
      return;
    }
    if(a==="cours-del"){
      const c = COURS.find(x=>x.id===nav.dataset.id);
      const n = c ? c.liens.length : 0;
      if(c) confirmBox("Supprimer ce cours ?","« "+c.nom+" » sera supprimé du catalogue"+(n?" et retiré du programme de "+n+" formation"+(n>1?"s":""):"")+". Cette action est définitive.", "cours:"+c.id);
      return;
    }
    if(a==="refl-add"){ S.refl = {type:nav.dataset.type, nom:null}; render(); const el=document.getElementById("r-nom"); if(el) el.focus(); return; }
    if(a==="refl-edit"){ S.refl = {type:nav.dataset.type, nom:nav.dataset.id}; render(); window.scrollTo(0,0); return; }
    if(a==="refl-cancel"){ S.refl = null; render(); return; }
    if(a==="refl-del"){
      const type = nav.dataset.type, nom = nav.dataset.id, c = REFL[type];
      const n = c.usage(nom);
      /* Un intitulé encore porté par une formation ne peut pas disparaître du référentiel. */
      if(n){ toast("« "+nom+" » est utilisé par "+n+" formation"+(n>1?"s":"")+" : modifiez-"+(n>1?"les":"la")+" d'abord.", true); return; }
      /* Un domaine classe aussi des débouchés : ils doivent d'abord changer de domaine. */
      const nd = type==="dom" ? DEBS.filter(x=>x.secteur===DOMAINES.find(v=>v.nom===nom).id).length : 0;
      if(nd){ toast("« "+nom+" » classe encore "+nd+" débouché"+(nd>1?"s":"")+" : changez leur domaine d'abord.", true); return; }
      confirmBox("Supprimer "+c.ce+" ?","« "+nom+" » sera retiré du référentiel. Cette action est définitive.", type+":"+nom);
      return;
    }
    if(a==="logo-choose"){ const f = document.getElementById("i-logo"); if(f) f.click(); return; }
    if(a==="logo-none"){ S.logoBrouillon = null; S.logoChoisi = true; logoApercu(); return; }
  }

  const sg = t.closest("[data-statut]");
  if(sg){ S.prog.statut = sg.dataset.statut; S.prog.page=1; render(); return; }
  const ag = t.closest("[data-ag]");
  if(ag){ S.inst.ag = ag.dataset.ag; S.inst.page=1; render(); return; }

  const pg = t.closest("[data-page]");
  if(pg && !pg.disabled){
    const h = currentHash();
    const s = h.indexOf("#/instituts")===0 ? S.inst : h.indexOf("#/cours")===0 ? S.cours : S.prog;
    s.page = +pg.dataset.page; render(); return;
  }

  if(t.closest("a[href^='#']") && S.sideOpen){ S.sideOpen=false; const s=document.getElementById("side"); if(s) s.classList.remove("open"); }
  if(t.classList && t.classList.contains("modal")) closeModal();
});

    if(!S.refl) return;
    const type = S.refl.type, ancien = S.refl.nom;
    const nom = document.getElementById("r-nom").value.trim();
    if(!nom){ fail("rnom","Ce champ est obligatoire."); return; }
    if(REFL[type].rows().some(r => r.nom!==ancien && norm(r.nom)===norm(nom))){ fail("rnom","« "+nom+" » existe déjà."); return; }
    /* Un renommage suit dans toutes les formations qui portent l'ancien intitulé. */
    if(type==="dip"){
      if(ancien===null) DIPS.push(nom);
      else { DIPS[DIPS.indexOf(ancien)] = nom; delete DUREE[ancien]; for(const f of Object.values(FORMES)) if(f.dip===ancien) f.dip = nom; }
      /* La durée suit dans les formations concernées à l'enregistrement (majProgrammes). */
      DUREE[nom] = +document.getElementById("r-duree").value;
    } else if(type==="deb"){
      const secteur = document.getElementById("r-sect").value;
      if(ancien===null) DEBS.push({nom, secteur});
      else {
        Object.assign(DEBS.find(d=>d.nom===ancien), {nom, secteur});
        for(const f of Object.values(FORMES)) f.jobs = f.jobs.map(j => j===ancien ? nom : j);
      }
    } else if(type==="dom"){
      const c = document.getElementById("r-coul").value;
      if(ancien===null) DOMAINES.push({id:"d"+Date.now(), nom, c});
      else Object.assign(DOMAINES.find(x=>x.nom===ancien), {nom, c});
      majDom();
    } else {
      const lib = document.getElementById("r-lib").value.trim();
      if(ancien===null) SERIES.push({nom, lib});
      else {
        Object.assign(SERIES.find(x=>x.nom===ancien), {nom, lib});
        for(const f of Object.values(FORMES)) f.series = f.series.map(x => x===ancien ? nom : x);
      }
    }
    saveBO();
    S.refl = null;
    toast(ancien===null ? "« "+nom+" » ajouté au référentiel." : "« "+nom+" » mis à jour.");
    render();
    return;
  }

  if(e.target.id==="cours-form"){
    e.preventDefault();
    clearFailures();
    if(!S.coursEdit) return;
    const id = S.coursEdit.id;
    const nom = document.getElementById("c-nom").value.trim();
    const liens = Array.from(document.querySelectorAll("#c-liens .lien")).map(r=>({forme:r.querySelector(".lien-forme").value, annee:+r.querySelector(".lien-annee").value}));
    if(!nom){ fail("cnom","L'intitulé est obligatoire."); return; }
    if(COURS.some(c => c.id!==id && norm(c.nom)===norm(nom))){ fail("cnom","Ce cours existe déjà au catalogue : modifiez-le pour le rattacher à d'autres formations."); return; }
    const double = liens.find((l,k)=>liens.findIndex(x=>x.forme===l.forme)!==k);
    if(double){ fail("cliens","« "+FORMES[double.forme].nom+" » est rattachée deux fois."); return; }
    if(id) Object.assign(COURS.find(c=>c.id===id), {nom, liens});
    else COURS.push({id:"c"+Date.now(), nom, liens});
    saveBO();
    /* En ajout, le formulaire reste ouvert sur les mêmes formations pour enchaîner. */
    S.coursEdit = id ? null : {id:null, liens};
    toast(id ? "Cours mis à jour." : "« "+nom+" » ajouté"+(liens.length?" et rattaché à "+liens.length+" formation"+(liens.length>1?"s":""):" au catalogue")+".");
    render();
    const el = document.getElementById("c-nom"); if(el) el.focus();
    return;
  }

  if(e.target.id==="forme-form"){
    e.preventDefault();
    clearFailures();
    const id = formeId();
    const g = n => document.getElementById(n).value.trim();
    const nom = g("f-nom"), inst = g("f-inst");
    const series = Array.from(document.querySelectorAll("#f-series input:checked")).map(x=>x.value);
    const tarifs = Array.from(document.querySelectorAll("#tarifs input")).map(x=>+x.value||0);
    const data = {
      nom, inst, dip:g("f-dip"), dom:g("f-dom"), desc:g("f-desc"),
      duree:dureeDip(g("f-dip"), FORMES[id] ? FORMES[id].duree : 1), tarifs, frais:tarifs[0]||0, stage:+g("f-stage")||0,
      series, admission:g("f-admission"),
      soir:document.getElementById("f-soir").checked,
      tranches:document.getElementById("f-tranches").checked,
      jobs:Array.from(document.querySelectorAll("#f-jobs input:checked")).map(x=>x.value),
      statut:g("f-statut")
    };
    /* Chaque message est affiché : on collecte les erreurs au lieu de les écraser. */
    const erreurs = [];
    const ko = (champ, msg) => { erreurs.push(fail(champ, msg)); };
    if(!nom) ko("nom","L'intitulé est obligatoire.");
    /* Une même filière peut exister dans plusieurs instituts, pas deux fois dans le même. */
    if(nom && Object.values(FORMES).some(f => f.id !== id && f.inst === inst && norm(f.nom) === norm(nom))) ko("nom","Cet institut propose déjà une formation avec cet intitulé.");
    if(!INST[inst]) ko("inst","Choisissez un institut.");
    if(!data.dip) ko("dip","Choisissez un diplôme.");
    if(tarifs.some(v => v<=0)) ko("frais","Indiquez les frais de chaque niveau.");
    if(!data.jobs.length) ko("jobs","Cochez au moins un débouché.");
    if(erreurs.length){ toast(erreurs.length+" erreur"+(erreurs.length>1?"s":"")+" dans le formulaire.", true); const bad=document.querySelector(".fld.bad"); if(bad && bad.scrollIntoView) bad.scrollIntoView({block:"center"}); return; }

    const key = id ? id : "f"+Date.now();
    FORMES[key] = Object.assign({id:key}, data);
    saveBO();
    /* Une formation neuve n'a pas encore de programme : on enchaîne sur ses cours. */
    if(id){ toast("Formation mise à jour."); location.hash = "#/formations"; }
    else { toast("Formation ajoutée. Ajoutez maintenant ses cours."); S.cours = {q:"",forme:key,page:1,par:10}; S.coursEdit = {id:null, liens:[{forme:key, annee:1}]}; location.hash = "#/cours"; }
    render();
    return;
  }

  if(e.target.id==="inst-form"){
    e.preventDefault();
    clearFailures();
    const id = instId();
    const g = n => document.getElementById(n).value.trim();
    const data = {
      nom:g("i-nom"), sigle:g("i-sigle").toUpperCase(), arr:g("i-arr"), adr:g("i-adr"),
      tel:g("i-tel"), wa:g("i-wa").replace(/\D/g,""), mail:g("i-mail"), ag:g("i-ag"),
      insc:+g("i-insc")||0, clot:g("i-clot"), rentree:g("i-rentree"), desc:g("i-desc"),
      avantages:lines(g("i-avantages"))
    };
    const erreurs = [];
    const ko = (champ, msg) => { erreurs.push(fail(champ, msg)); };
    if(!data.nom) ko("nom","Le nom complet est obligatoire.");
    if(data.nom && Object.values(INST).some(i => i.id !== id && norm(i.nom) === norm(data.nom))) ko("nom","Cet institut est déjà au catalogue.");
    if(!data.sigle) ko("sigle","Le sigle est obligatoire.");
    /* Un sigle déjà pris par un autre institut rendrait la liste publique ambiguë. */
    const autre = data.sigle ? Object.keys(INST).find(k => k!==id && INST[k].sigle === data.sigle) : null;
    if(autre) ko("sigle","Le sigle « "+data.sigle+" » est déjà utilisé par "+INST[autre].nom+".");
    if(!data.tel) ko("tel","Le téléphone est obligatoire.");
    if(!data.wa || data.wa.length<8) ko("wa","Le numéro WhatsApp est incomplet.");
    if(!data.adr) ko("adr","L'adresse est obligatoire.");
    if(data.mail && data.mail.indexOf("@")<1) ko("mail","Cette adresse électronique est incomplète.");
    /* Une rentrée avant la clôture des inscriptions n'a pas de sens. */
    if(data.clot && data.rentree && data.rentree < data.clot) ko("rentree","La rentrée ("+data.rentree+") est antérieure à la clôture des inscriptions ("+data.clot+").");
    if(erreurs.length){ toast(erreurs.length+" erreur"+(erreurs.length>1?"s":"")+" dans le formulaire.", true); const bad=document.querySelector(".fld.bad"); if(bad && bad.scrollIntoView) bad.scrollIntoView({block:"center"}); return; }

    const key = id ? id : "i"+Date.now();
    const existing = INST[key];
    data.c = existing ? existing.c : DOMAINES[Object.keys(INST).length % DOMAINES.length].c;
    /* Sans nouvelle image choisie, on conserve celle déjà en place. */
    data.logo = S.logoChoisi ? (S.logoBrouillon || null) : (existing ? existing.logo || null : null);
    S.logoChoisi = false;
    INST[key] = Object.assign({}, existing||{}, data, {id:key});
    saveBO();
    S.logoBrouillon = null;
    toast(existing?"Institut mis à jour.":"Institut ajouté au catalogue.");
    location.hash = "#/instituts";
    render();
    return;
  }
});

/* ---------- Réinitialisation ---------- */
function resetAll(){
  store.del("orienta-bo"); store.del("orienta-bo-session");
  store.del("orienta-theme");
  SESSION = null;
  S.logoBrouillon = null;
  S.logoChoisi = false;
  S.prog = {q:"",dom:"",statut:"",page:1,par:8};
  S.inst = {q:"",arr:"",ag:"",page:1,par:6};
  S.refl = null;
  S.cours = {q:"",forme:"",page:1,par:10};
  S.coursEdit = null;
  document.documentElement.setAttribute("data-theme","light");
  /* On repasse d'abord à l'écran de connexion, puis on recharge : le rechargement
     restaure le jeu de démonstration d'origine. */
  location.hash = "#/connexion";
  render();
  location.reload();
}

/* ---------- Thème au démarrage ---------- */
(function(){ const th = store.get("orienta-theme",null); if(th) document.documentElement.setAttribute("data-theme",th); })();

window.addEventListener("hashchange", render);
render();
</script>
